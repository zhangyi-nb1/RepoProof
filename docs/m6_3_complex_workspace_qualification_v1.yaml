schema_version: 3
protocol_id: m6.3-complex-workspace-qualification-v1
status: DRAFT_NOT_FROZEN
baseline_branch: codex/m6-2-workspace-bundle-qualification
delivery_profile_id: workspace_bundle_v1
profile_status_before_batch: SUPPORTED
supersedes_protocol_id: null
purpose: >-
  M6.2 证明 workspace_bundle_v1 能在受支持范围内把单一能力做成经独立验证的
  离线多文件工作区。本批把复杂度推向三个方向：二进制办公/图像/编译产物、
  多输入多派生的跨文件一致性、以及"可重生成"的静态站点/仪表盘；同时保留
  一个来自真实用户想法的预期拒绝负控（N0），用于机器钉死支持面边界。
inherits_from_m6_2:
  execution_policy: 与 m6.2-workspace-bundle-qualification-v2 完全一致（默认 LiteLLM/API 网关起草、mini-swe 实现、批次内不切换后端、网关故障暂停）
  contract_policy: 一致（冻结件不可变；语义改变必须新 task version；首轮终态不改写）
  incident_policy: 一致（先事故→匿名负控→通用层修复→转绿；安全/false-success 首例可修；普通问题双独立事故）
  verification_policy: 一致（结构/格式/语义/反事实/运行/clean replay/fresh audit；Product 记录不计 Lab）
  new_in_this_batch:
    - 起草自检自修（draft_selfcheck.json）在人审前自动运行；readiness 以 DRAFT_SELF_CHECK_* 阻塞冻结
    - verifier 判别力探针：产物协议引用到的每个文件至少一种内容变异被拒
    - conformance 准入面对齐 pytest 实际收集面；conformance 零选中须作为案例级注记记录
    - 新格式先由 Harness-owned validation profile 机检结构层，再由 task verifier 复核语义
scope:
  public_github_only: true
  python_first: true
  local_cpu: true
  credentials: none
  network_at_runtime: none
  lifecycle: per_invocation
wheelhouse_freeze:
  platform: {os: macos, arch: arm64, python: "3.12"}
  policy: 发车前每案冻结离线 wheelhouse（名称/大小/SHA-256 + 目录 root），未冻结即 BLOCKED_BEFORE_EXECUTION
  status: NOT_FROZEN
validation_profiles_required_before_freeze:
  - {id: xlsx_v1, kind: zip+xml, check: 合法 OOXML 包、工作表数、单元格值/公式字符串可解析}
  - {id: pptx_v1, kind: zip+xml, check: 合法 OOXML 包、幻灯片数、文本框文本可提取}
  - {id: png_v1, kind: binary, check: PNG 签名、尺寸、可无损解码}
  - {id: ics_v1, kind: text, check: RFC 5545 折行/组件配对可解析}
  - {id: ipynb_v1, kind: json, check: nbformat 4 schema 通过}
  - {id: mo_v1, kind: binary, check: gettext magic + 条目数可读}
  - {id: static_site_v1, kind: directory, check: index.html 存在、内链闭合、无外链资源}
cases:
- order: 0
  case_id: n0-live-balance-monitor
  kind: expected_rejection
  repository: https://github.com/BerriAI/litellm
  revision: null
  initial_user_request: 我想实时监控我的 Codex 和 Claude App 账户余额，随时看到还剩多少额度。
  expected_reason_code: UNSUPPORTED_CREDENTIALLED_EXTERNAL_SIDE_EFFECT
  expected_agent_invocations: 0
  expected_repair_attempts: 0
  note: >-
    真实用户想法，作为负控：凭证 + 联网 + 常驻生命周期三项同时越出 workspace_bundle_v1
    支持面，必须在 admission 零模型拒绝。其离线可行形态见 c3。
- order: 1
  case_id: c1-xlsx-reconciliation-workbook
  kind: complex
  repository: https://github.com/jmcnamara/XlsxWriter
  revision: RELEASE_3.2.9
  resolved_commit: e943bee8c9cdf0661cfdb83d5497e0725390e41e
  distribution: XlsxWriter
  import_module: xlsxwriter
  initial_user_request: 每个月财务给我三四张 CSV（发票、付款、科目表），我想一键得到一个能直接交给审计的 Excel 工作簿，带汇总页和异常标红。
  input: directory_with_csv_ledgers_and_mapping_yaml
  required_artifact_roles: [xlsx_workbook, summary_sheet, formulas, conditional_formats, data_dictionary_md, exceptions_csv, readme]
  runnable: false
  complexity_axes: [binary_office_output, cross_sheet_formulas, multi_input_reconciliation]
  verification_hint: verifier 用 stdlib zipfile+xml 解析 sheet XML 复核单元格值与公式字符串；上游调用可观测点为 xlsxwriter.Workbook
- order: 2
  case_id: c2-pptx-quarterly-briefing
  kind: complex
  repository: https://github.com/scanny/python-pptx
  revision: v1.0.2
  resolved_commit: 278b47b1dedd5b46ee84c286e77cdfb0bf4594be
  distribution: python-pptx
  import_module: pptx
  initial_user_request: 我有季度指标的 JSON 和一份要点笔记，想生成一套能直接汇报的幻灯片，再附一份讲稿。
  input: directory_with_metrics_json_and_notes_md
  required_artifact_roles: [pptx_deck, title_slide, metric_slides, speaker_notes_md, slide_index_csv, readme]
  runnable: false
  complexity_axes: [binary_office_output, text_to_layout_mapping, derived_notes]
  verification_hint: verifier 用 pptx.Presentation 重新打开产物复核幻灯片数、标题与文本框文本；讲稿 md 逐页与幻灯片标题对齐
- order: 3
  case_id: c3-offline-usage-dashboard
  kind: complex
  repository: https://github.com/Kozea/pygal
  revision: "3.1.3"
  resolved_commit: 056424cf548677ee42a1d87166418e9c9772e3da
  distribution: pygal
  import_module: pygal
  initial_user_request: 我从 OpenAI 和 Anthropic 后台导出了几份用量/账单 CSV，想要一个本地就能打开、能按天按模型看花了多少、余额还剩多少、超阈值就提醒的仪表盘，以后每次导出新数据重跑一下就更新。
  input: directory_with_provider_usage_csvs_and_budget_yaml
  required_artifact_roles: [dashboard_html, svg_charts, sqlite_ledger, alerts_md, regenerate_script, readme]
  runnable: true
  complexity_axes: [multi_source_normalisation, svg_charts, sqlite_binary, regenerable_static_site]
  verification_hint: 余额/阈值告警由 verifier 从 CSV 独立重算并与 SQLite、SVG 文本节点、alerts.md 三处交叉核对；SVG 通过 pygal 重渲染比对结构
  note: 这是 N0 想法的离线可支持形态：数据来自本地导出文件，不持凭证、不联网、按次重生成
- order: 4
  case_id: c4-photo-contact-sheet
  kind: complex
  repository: https://github.com/python-pillow/Pillow
  revision: "12.3.0"
  resolved_commit: bb1d8e8ab8d29048624d96e3ee53cecf7c13d13d
  distribution: pillow
  import_module: PIL
  initial_user_request: 一个文件夹里几百张实验照片，我想要缩略图、一张总览拼图、每张图的尺寸和拍摄信息表，还要一个能离线翻看的索引页。
  input: directory_with_png_jpeg_images
  required_artifact_roles: [thumbnails_dir, contact_sheet_png, metadata_json, index_html, readme]
  runnable: false
  complexity_axes: [binary_image_output, deterministic_rendering, metadata_extraction]
  verification_hint: verifier 用 PIL 重新解码缩略图与拼图，核对尺寸、像素采样与 metadata.json 一致；builder 用 PIL 生成确定性输入图
- order: 5
  case_id: c5-offline-docs-site
  kind: complex
  repository: https://github.com/mkdocs/mkdocs
  revision: "1.6.1"
  resolved_commit: bb7e8b62185b11d9f59bb7f50b13c15134f62f8a
  distribution: mkdocs
  import_module: mkdocs
  initial_user_request: 团队的 Markdown 文档散在一个目录里，我想生成一个不用联网就能翻、能搜、有目录的文档站，交接给下一任。
  input: directory_with_markdown_docs_and_nav_yaml
  required_artifact_roles: [static_site, search_index_json, sitemap, nav_config, readme]
  runnable: false
  complexity_axes: [multi_file_site, internal_link_closure, search_index_derivation]
  verification_hint: verifier 调 mkdocs 的 API 重建导航与页面集合并核对 HTML 内链闭合、search_index 词条来源；禁止 CDN/外链资源
- order: 6
  case_id: c6-calendar-schedule-pack
  kind: complex
  repository: https://github.com/collective/icalendar
  revision: v7.3.0
  resolved_commit: 138c8453db34fbb584bbcbc592fd7bd4b972e8ef
  distribution: icalendar
  import_module: icalendar
  initial_user_request: 排班表和课程表都是 CSV，我想导入手机日历，同时要一张能打印的周视图和一份冲突清单。
  input: directory_with_schedule_csvs_and_timezone_yaml
  required_artifact_roles: [ics_calendar, week_view_html, conflicts_csv, readme]
  runnable: false
  complexity_axes: [rfc5545_text_output, timezone_semantics, cross_artifact_consistency]
  verification_hint: verifier 用 icalendar 重新解析 .ics 核对事件集合、时区与冲突；周视图 HTML 事件数与 ics 一致
- order: 7
  case_id: c7-analysis-notebook-pack
  kind: complex
  repository: https://github.com/jupyter/nbformat
  revision: v5.11.1
  resolved_commit: 75f819f5b60bc6ffc72145c364132efe5b3c4b35
  distribution: nbformat
  import_module: nbformat
  initial_user_request: 我有一堆零散的分析代码片段和一份数据，想整理成一个规范的 Jupyter 笔记本交给同学，还要一份纯文本版方便审阅。
  input: directory_with_code_snippets_and_csv
  required_artifact_roles: [ipynb_notebook, markdown_export, requirements_txt, readme]
  runnable: false
  complexity_axes: [schema_validated_json_output, ordered_cell_derivation, dual_representation]
  verification_hint: verifier 用 nbformat.validate 校验并核对单元顺序/来源片段一一对应；markdown 导出与单元文本逐条对齐
- order: 8
  case_id: c8-translation-catalog-pack
  kind: complex
  repository: https://github.com/python-babel/babel
  revision: v2.18.0
  resolved_commit: 56c63caf50b18b152541b5dcafd51f645d867074
  distribution: babel
  import_module: babel
  initial_user_request: 我们的翻译文件是一堆 .po，想一键编译成程序能用的格式，并给我一份哪些语言还缺翻译的报告。
  input: directory_with_po_catalogs
  required_artifact_roles: [mo_binaries, coverage_csv, missing_entries_md, readme]
  runnable: false
  complexity_axes: [binary_compiled_output, per_locale_aggregation, fidelity_to_source]
  verification_hint: verifier 用 babel.messages 重新读 .po 并核对 .mo 条目集合与覆盖率数字
profile_promotion_gate:
  applies_to: workspace_bundle_v1 (已 SUPPORTED；本批不改 profile 状态)
  batch_success_definition: 八个复杂案例中 ≥6 个经修复后 ACTIVE，且二进制办公类（c1/c2）、图像类（c4）、可重生成站点类（c3）各至少一个
  failure_reporting: 每案唯一终态；conformance 零选中须记录为案例级注记
freeze_checklist:
  - 逐案解析 resolved_commit 并匿名浅克隆分析（已解析 tag→commit，未克隆）
  - 逐案 pip download 冻结 wheelhouse 并写 manifest SHA-256
  - 为七个新 validation profile 写 Harness-owned 结构校验 + 匿名正负控
  - 计算本文件 SHA-256 并写入 HANDOFF_STATE；之后不再编辑
