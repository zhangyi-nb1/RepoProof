# Runtime profile 声明:rt-dsh-minimal-0.1.0rc6-v1(DSH 集成线,阶段 1)
# 决策与边界:docs/adr/ADR-DSH-MINIMAL-AGENT-BACKEND.md
# 封存与核验:scripts/provision_dsh_runtime.py(--go / --verify)
schema_version: 1
runtime_profile_id: rt-dsh-minimal-0.1.0rc6-v1
backend_id: dsh-minimal
# 仓内词表(experimental → candidate → qualified → default);晋级走
# promote_profile 一路,rt-sidecar-* 的资格不迁移。
status: experimental

sdk:
  distribution: deepseek-harness-sdk
  version: 0.1.0rc6
  sha256: 8a05421be4298196cf94383e0a3164b020f5f5977a8d30019cc5add64cb208eb

runtime:
  distribution: deepseek-harness-runtime-bin
  version: 0.1.0rc6
  platform: macosx_14_0_arm64
  sha256: 2bbd65edd52dfc340d74f88a890e8031a272a820e58406c2de1f5f5dee51bd9f
  other_platforms:
    manylinux_2_28_x86_64: d7261d3bdadfa8d10ab03fd06c6bbc66a182ae27d39892a0eb7c2ce9d63a5448
    manylinux_2_28_aarch64: 99d0ef334a4e3cb178d7b0302bbdd01c8dde6068ee5fe8b01e074541db5c7747

# SDK 依赖闭包(pip 实解,逐枚对 PyPI 官方摘要核验;cp312 ⇒ 封存 venv
# 钉 Python 3.12,provision --go 前置核)
dependencies:
  pydantic: {version: 2.13.4, sha256: 45a282cde31d808236fd7ea9d919b128653c8b38b393d1c4ab335c62924d9aba}
  pydantic-core: {version: 2.46.4, platform: cp312-macosx_11_0_arm64,
                  sha256: 962ccbab7b642487b1d8b7df90ef677e03134cf1fd8880bf698649b22a69371f}
  annotated-types: {version: 0.8.0, sha256: f072f4d804ea359e4eaf198b1af7a8b0943881a87f31bb764f8bf219bb9419e0}
  typing-extensions: {version: 4.16.0, sha256: 481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8}
  typing-inspection: {version: 0.4.4, sha256: 65b8397ba37ccbce054456aaccddfc91e6e3083c92824df348d96ca832f3f147}

composition:
  name: minimal
  variant: upstream-jsonrpc-agent-example   # SDK 正典组合,非 CLI preset
  upstream_path: examples/jsonrpc-agent/minimal.cordis.yml
  source_commit: 47f943859bef60e4160492346772ded9b24f765a
  sha256: 4ddf99b5492fac7b578e3caddb0158815e44d5db176ba0aeab57012d35299fca
  patched: false
  repo_copy: configs/dsh/minimal.upstream.0.1.0rc6.cordis.yml
  # 组合面向模型只有持久 bash + str_replace_editor;无 compaction /
  # subagent / web / skills;maxTokensAsSuccess=false;会话 JSONL 不压缩。
  env_hooks: [DEEPSEEK_API_KEY, DSH_MODEL, DSH_CONTEXT_WINDOW, DSH_CWD,
              DSH_SYSTEM_PROMPT, DSH_SESSION_ROOT]

isolation:
  disposable_workspace: true
  oracle_mounted: false
  verifier_mounted: false
  ledger_mounted: false
  environment_policy: allowlist
  # 官方 sandbox-policy 是 danger-full-access:cwd 不是沙箱。边界靠
  # disposable checkout + 进程组 + host_guard 保护目录;容器化列为 OS 阶段增强。

budget:
  note: 总预算(请求数/总 in/总 out/墙钟)由 RepoProof 外部强制,逐批在
    预注册里冻结,不在 profile 里定;SDK max_tokens 只是每请求出口上限。

trust:
  final_response_is_evidence: false
  dsh_jsonl_is_trusted: false
  host_event_sink_is_trusted: true
  final_verdict_owner: repoproof-completion-gate

license:
  spdx: MIT
  notice_path: third_party/deepseek-harness/NOTICE.md

provisioning:
  script: scripts/provision_dsh_runtime.py
  sealed_root: ~/RepoProofRuntimes/rt-dsh-minimal-0.1.0rc6-v1
