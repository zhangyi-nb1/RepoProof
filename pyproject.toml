[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repoproof"
version = "0.1.0"
description = "Turn pinned GitHub capabilities into independently verified local tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.21",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.14",
    # provider 通道(litellm 路)与 agent 执行后端(mini-swe-agent)是
    # 运行期可选件,但测试收集要 import 它们(conftest 连接池隔离夹具、
    # runner 协议钉)—— 测试环境必备,故入 dev。
    "litellm>=1.75",
    "mini-swe-agent>=2.0",
]
ui = [
    "streamlit==1.60.0",
]

[project.scripts]
repoproof = "repoproof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repoproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    # 标记"这条慢",但**不默认跳过** —— 跳过的判据等于没有判据。
    # 目前最慢的一条是回执正负控矩阵(要起 9 次 HTTP 服务,约十几秒)。
    "slow: 显著慢于其他用例;仍然默认运行",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/repoproof"]
ignore_missing_imports = true

# 类型兜底现覆盖**除 Lab 冻结区外的全部源码**:产品可信链、在役 runner
# 七件、ui 展示面、agents(DSH 线)、cli —— 一律 0 错。
# 渐进队列已清空(2026-08-26 摘 runner 在役件 19 错;2026-08-27 摘
# ui/agents/cli 63 错,其中两枚是真崩溃:`tool plan --repo` 漏传必填
# cache_root、运行活动页 st.progress(None) 抛 StreamlitAPIException)。
# 唯一剩下的豁免 = Lab 冻结区,**逐文件列名**(FROZEN 2026-08-25,见
# docs/PROJECT_MAP.md):整包通配会给新增模块开暗门,故不用 runner.*。
# 棘轮只进不退:名单只许减,新增受检模块不得靠加 override 绕过。
[[tool.mypy.overrides]]
module = [
    "repoproof.runner.host_guided",
    "repoproof.runner.baseline",
    "repoproof.runner.guided_repair",
    "repoproof.runner.agent_run",
    "repoproof.runner.sidecar_session",
    "repoproof.runner.calibration",
    "repoproof.runner.demo",
    "repoproof.runner.scaffold",
]
ignore_errors = true

[tool.ruff.lint.per-file-ignores]
# 突变闸的 old/new 是对目标源码的**逐字节精确匹配串**——断行即废掉
# 突变注入(注不进去 = 闸静默失效),长行在此是机械要求不是风格债。
"scripts/mutation_gate.py" = ["E501"]
