[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repoproof"
version = "0.1.0"
description = "Turn pinned GitHub capabilities into independently verified local tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.14",
    # provider 通道(litellm 路)与 agent 执行后端(mini-swe-agent)是
    # 运行期可选件,但测试收集要 import 它们(conftest 连接池隔离夹具、
    # runner 协议钉)—— 测试环境必备,故入 dev。
    "litellm>=1.75",
    "mini-swe-agent>=2.0",
]
ui = [
    "streamlit==1.60.0",
]

[project.scripts]
repoproof = "repoproof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repoproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    # 标记"这条慢",但**不默认跳过** —— 跳过的判据等于没有判据。
    # 目前最慢的一条是回执正负控矩阵(要起 9 次 HTTP 服务,约十几秒)。
    "slow: 显著慢于其他用例;仍然默认运行",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/repoproof"]
ignore_missing_imports = true

# 类型兜底的覆盖边界 = 产品可信链(adoption/verification/harness/domain/
# persistence/execution/receipts/probes)+ **在役 runner 七件**
# (tool_pipeline/export/registry/release/mcp/paths/host_bridge,
# 2026-08-26 摘出豁免队列):判定、闸门、证据链、产品运营所在的代码
# 必须 0 错。下列豁免是**显式登记的冻结区/渐进队列**,不是默认放水:
# - runner 冻结区逐文件列名(Benchmark Lab 执行引擎,FROZEN 2026-08-25,
#   见 docs/PROJECT_MAP.md)—— 不再用 runner.* 整包兜底,新增 runner
#   模块默认受检;
# - agents.* :DSH 后端线(E 轨已关闭);
# - ui.*    :Streamlit 展示面,不参与判定;
# - cli     :入口聚合层。
# 从队列里摘除一个模块 = 把它的错清零后删掉对应 override(棘轮只进不退)。
[[tool.mypy.overrides]]
module = [
    "repoproof.runner.host_guided",
    "repoproof.runner.baseline",
    "repoproof.runner.guided_repair",
    "repoproof.runner.agent_run",
    "repoproof.runner.sidecar_session",
    "repoproof.runner.calibration",
    "repoproof.runner.demo",
    "repoproof.runner.scaffold",
    "repoproof.ui.*",
    "repoproof.agents.*",
    "repoproof.cli",
]
ignore_errors = true

[tool.ruff.lint.per-file-ignores]
# 突变闸的 old/new 是对目标源码的**逐字节精确匹配串**——断行即废掉
# 突变注入(注不进去 = 闸静默失效),长行在此是机械要求不是风格债。
"scripts/mutation_gate.py" = ["E501"]
