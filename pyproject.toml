[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repoproof"
version = "0.1.0"
description = "Evidence-driven harness for verifiable open-source capability adoption"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
ui = [
    "streamlit==1.60.0",
]

[project.scripts]
repoproof = "repoproof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repoproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    # 标记"这条慢",但**不默认跳过** —— 跳过的判据等于没有判据。
    # 目前最慢的一条是回执正负控矩阵(要起 9 次 HTTP 服务,约十几秒)。
    "slow: 显著慢于其他用例;仍然默认运行",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
