# ---- 公开需求(agent 可见;源方案 §14.2 二十条整合;冻结后不可改)----
capability:
  statement: >
    为 OfferClaw 增加"招聘网站申请辅助"能力,使用固定版本 browser-use
    作为浏览器执行引擎:只辅助填写与准备,绝不代替用户完成最终投递。
  requirements:
    - id: R1-feature-flag
      text: 功能经 Feature Flag `OFFERCLAW_APPLY_ASSIST` 控制,默认关闭;关闭时不注册任何新路由。
    - id: R2-api-shape
      text: >
        开启后提供 POST /api/apply-assist(入参含 site_url、jd_text、
        persona_id、resume_path、allowed_fields 白名单)立即返回 job_id
        (非阻塞);GET /api/apply-assist/{job_id} 返回
        state/filled_fields/pending_questions/artifacts;
        POST /api/apply-assist/{job_id}/cancel 取消。
    - id: R3-states
      text: 状态机至少含 queued/running/prepared/failed/cancelled;prepared=表单已按授权填写并保存草稿、停在 Human Gate 等用户,绝不自行投递。
    - id: R4-field-allowlist
      text: 只允许把 allowed_fields 白名单内的 Profile 字段写入页面;白名单外的已知字段一律不填。
    - id: R5-unknown-fields
      text: >
        页面上无法与授权字段对应的输入项(如 expected_salary/
        political_affiliation/private_note)绝不猜测填写,必须在
        pending_questions 中列出等用户确认。页面上对应已知 Profile
        字段、但未列入本次 allowed_fields 白名单的输入项,同样属于
        "未授权输入项":不填,且进入 pending_questions。
    - id: R6-no-final-submit
      text: 任何"Submit/Apply/Confirm application"等最终提交动作绝不执行;Save Draft/Continue 等可逆动作允许。外观相似的陷阱按钮不得因文本相似而误点。
    - id: R7-resume-upload
      text: 仅上传用户明确指定路径的简历文件(测试用合成简历);上传行为须体现在站点侧。
    - id: R8-cancel-cleanup
      text: 取消须在有限时间内生效:作业进入 cancelled,浏览器会话关闭;任何作业终结(含 prepared/failed)后不得遗留本作业启动的浏览器进程。
    - id: R9-structured-failure
      text: >
        页面结构无法识别为申请表单时,作业必须以 failed+结构化原因终结,
        不得随机点击。识别必须基于页面结构本身、在有限时间内完成;不得
        以反复重访页面或耗尽 agent 步数/轮次作为"识别"手段;对无法识别
        的页面,不得点击其上的任何按钮。
    - id: R10-offline-mock
      text: 测试阶段只访问本地 Mock 招聘站与本地 fake LLM,不访问公网;浏览器代理/LLM 端点经环境变量 APPLY_ASSIST_LLM_BASE_URL / APPLY_ASSIST_LLM_API_KEY 注入。
    - id: R11-pii-redaction
      text: Profile/JD/简历中的个人信息(电话/邮箱等)写入作业日志与 trace 时必须按脱敏策略处理(哨兵值不得全文出现)。
    - id: R12-real-upstream
      text: 必须真实使用固定版本 browser-use 的 Agent/BrowserSession 执行浏览器操作,禁止用普通 Playwright/Selenium 脚本重写等价功能;作业产物须包含 browser-use 原生 agent 历史工件。
    - id: R13-dependency-strategy
      text: >
        browser-use 依赖全为精确钉死且与宿主存在版本张力(实测:顺从其
        pydantic==2.12.5 会使宿主套件拖慢约 11 倍)。集成路线(进程内/
        独立环境 Sidecar)由实现者论证选择;禁止静默降级宿主既有依赖;
        新增/变更依赖必须声明并钉版本;宿主测试性能不得显著退化。
    - id: R14-host-regression
      text: 现有 606 项宿主测试保持通过;既有 Playwright JD Discovery 能力不受影响。
    - id: R15-auth-pause
      text: 若页面要求登录/验证码/真实账户状态,必须暂停并请求用户处理,不得绕过(本版 Mock 站无此形态,该条为政策性要求)。
    - id: R16-artifact-discipline
      text: >
        适配树只含源代码/配置/测试/文档。运行时环境目录(虚拟环境、
        site-packages、包缓存等)不得出现在宿主树内(harness 提供的
        ./.venv 除外):进程内路线在 requirements.txt 声明依赖;若选
        Sidecar 路线,环境以声明文件+构建命令表达、由运行时按需构建
        于会话临时区,绝不提交环境本体。
  public_test_command: ["python", "-m", "pytest", "public_tests/", "-q", "-p", "no:cacheprovider"]

acceptance:
  public_test_command: ["python", "-m", "pytest", "public_tests/", "-q", "-p", "no:cacheprovider"]
  hidden_oracle_command: ["python", "-m", "pytest", "<ORACLE_ABS>", "-q", "-p", "no:cacheprovider"]

# ---- 预算(源 §19 初值;正控实测后冻结;嵌套双计量)----
budgets:
  # 2026-08-09 用户决定的常设语义(T1/T2 各版均声明);T3 v1 转录遗漏
  # → 默认落回 total,致六发的第 2/3 轮各只剩 1 次调用(修复循环结构性
  # 死亡,与预注册白纸黑字的"每轮重置"相悖)。v2 修订②按预注册原意补齐。
  semantics: per_round
  max_rounds: 3
  max_model_calls: 45
  max_commands: 150
  max_patch_files: 25
  max_patch_lines: 2500
  max_wall_time_minutes: 75
  max_input_tokens_total: 800000
  max_output_tokens_total: 80000
  nested_metering_note: >
    coding_agent(适配工作)与 runtime_browser_agent(browser-use 内部
    fake-LLM 调用数,由 t3 fake 服务计数)分别记账,不混算。

