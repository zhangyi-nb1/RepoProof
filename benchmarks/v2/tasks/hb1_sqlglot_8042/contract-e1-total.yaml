# hb1-sqlglot-8042 的 E1 桥接批变体(E1-DSH-MINIMAL-BRIDGE-1 专用)。
#
# 与 contract-dsh-total.yaml(v1-dsh-total)唯一差异:max_model_calls 90→500。
# 依据(DQ-SDK-1 附录五实证,预注册 E1 §5 展开):四次真跑逐发
# logical_requests=91 撞 90 上限(含 PASS 发),彼时 token 信封仅用 3-4%
# (55-77K / 1.8M)—— calls 轴的 90 来自 mini-swe 环的机制常数(30/轮×3),
# 把它当资源上限强加给请求重/token 轻的 DSH 臂,恰是臂中立的反面。
# 本变体把 calls 轴改为**两臂同值的逃逸后备**(500 > 墙钟可及的
# ~180-240 请求),运营约束回到真正的资源轴:token 双轴 + 墙钟 + commands
# ——四轴两臂逐字同值。跑飞保护仍在:max_llm_attempts=logical×3、
# commands 300、墙钟 60 分。其余各节与 v1-dsh-total 逐字一致。
task_id: hb1-sqlglot-8042
task_version: v1-e1-total
kind: host_integrated
prompt_profile: hb-delta-v1
host:
  repo: tobymao/sqlglot
  commit: 00ca3ed452a5a315447ede73c75e70520dd11e68
  copy_path: ~/RepoProofBench/hb1-sqlglot-8042/host
  regression_command:
    - .venv/bin/python
    - -m
    - pytest
    - tests
    - -q
    - -p
    - "no:cacheprovider"
  regression_baseline: "1150 passed, 0 skipped, 0 failed"
  setup_commands:
    - [python3, -m, venv, .venv]
    - [env, SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0, .venv/bin/pip, install, -q, --no-index, -e, ., pytest, duckdb, pandas, python-dateutil, pytz, typing_extensions]
  health_checks:
