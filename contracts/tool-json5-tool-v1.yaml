task_id: tool-json5-tool-v1

source_repo:
  url: https://github.com/dpranke/pyjson5
  revision: guided
  resolved_commit: 1f7f8062a76d5899288674b938e73b7bcadf63c3
  license: Apache-2.0
  distribution: json5
  import_module: json5

target_project:
  kind: local_tool
  path: fixtures/tool_skeleton_json5-tool
  package: json5_tool
  entry_point: json5-tool

requirement_spec_file: tool-json5-tool-v1.requirements.yaml
task_family: LOCAL-TOOL
adoption_shape: TOOL_ONBOARDING

tool: {"name": "json5-tool", "summary": "将 JSON5 文件规范化为严格 JSON 文本输出。", "interface": {"usage": "json5-tool <input> [--out FILE]", "input": {"kind": "file", "format": "JSON5"}, "output": {"kind": "stdout", "format": "JSON"}, "exit_codes": {"0": "success", "1": "user_error", "2": "internal_error"}}}

capability:
  statement: >
    读取一个本地 JSON5 文件，使用 json5 解析其内容，并输出严格 JSON 文本。输入可包含 JSON5 支持的注释、尾随逗号、单引号字符串、未加引号的对象键等语法；输出必须是 RFC 兼容的 JSON：对象键与字符串均使用双引号，注释与尾随逗号被移除，空白被规范化为无多余空格的紧凑形式。对象键按 Unicode 码点排序以保证稳定输出；数组顺序保持不变；JSON5 解析后的重复对象键遵循上游解析器的覆盖语义。字符串转义由 JSON 序列化器规范化，输出使用 UTF-8 文本且不强制 ASCII 转义。若解析结果包含 NaN、Infinity 或 -Infinity 等严格 JSON 无法表示的非有限数值，则视为无效输入。格式错误、空输入、无法读取或无法编码为严格 JSON 的输入均抛出 UserInputError（退出码 1）。重复运行在相同输入与相同依赖版本下确定性一致。工具完全离线运行，不访问网络。 交付形态为标准工具包(TOOL_PACKAGE_LAYOUT):在骨架 src/json5_tool/impl.py 实现 extract(),必须调用 pinned json5;依赖锁进 requirements.lock.txt(replay 从它重建)。行为以公开样例为准(例:json5-tool --help -> 'contains:usage'; json5-tool config.json5 -> 见 config.expected.json; json5-tool simple.json5 -> 'contains:"greeting":"你好"');坏输入抛 UserInputError(→exit 1);重复调用确定;完全离线 CPU-only。骨架锚定件(main.py/bin/build.sh/tool.json/pyproject)不可改。公开样例与可运行公开测试位于骨架 public_tests/ 下,是本合同的一部分。
  output_schema: JSON

environment: {os: linux, arch: arm64, python: "3.12", cpu_only: true, network_install: true, network_test: false}

constraints:
  forbidden: [gpu, privileged_container, oracle_write, model_download, network_at_test_time]
  editable_zones: [tool]
  forbidden_install_extras: []

budgets:
  max_agent_steps: 20
  max_wall_time_minutes: 30
  max_command_minutes: 5
  max_semantic_recoveries: 3
  max_same_action: 2
  max_patch_files: 12
  max_patch_lines: 600
  max_input_tokens_total: 400000
  max_output_tokens_total: 40000
  monetary_soft_cap_usd: 5.0

acceptance:
  capability_command: ["pytest", "-q", "/oracle/test_capability.py"]
  regression_command: ["pytest", "-q", "public_tests/test_interface_contract.py"]
  probe_script: direct_tool_probe.py
