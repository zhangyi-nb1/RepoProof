tool:
  schema_version: 4
  name: python-pptx-tool
  summary: 用 python-pptx 把季度指标 JSON 和要点笔记打包成离线工作区，生成可汇报的 .pptx 幻灯片并附带讲稿。
  interface:
    usage: python-pptx-tool <input> --out-dir <new-directory>
    input:
      kind: file
      format: JSON (指标+要点笔记)
      contract: null
    output:
      kind: directory
      format: workspace directory
      contract: null
    exit_codes:
      '0': success
      '1': user_error
      '2': internal_error
  delivery_profile_id: workspace_bundle_v1
  workspace_contract:
    schema_version: 1
    rules:
    - path_pattern: build_deck.py
      role: 由 build_workspace 写入的幻灯片/讲稿生成应用文件（非可执行，经 run.sh 调用）
      media_type: text/x-python
      validation_profile: python_compile_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: metrics.json
      role: 契约内的示例输入 JSON，run.sh 默认无参数时不使用它，仅供用户参考
      media_type: application/json
      validation_profile: json_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: out/quarterly_report.pptx
      role: 生成的 PowerPoint 幻灯片
      media_type: application/vnd.openxmlformats-officedocument.presentationml.presentation
      validation_profile: pptx_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: out/speaker_notes.txt
      role: 配套讲稿文本
      media_type: text/plain
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: README.md
      role: 面向用户的使用说明（指示运行 ./run.sh）
      media_type: text/markdown
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: run.sh
      role: Harness-owned offline Python launcher
      media_type: text/x-shellscript
      validation_profile: shell_v1
      min_count: 1
      max_count: 1
      executable: true
    - path_pattern: requirements.lock.txt
      role: Frozen Python dependency lock
      media_type: text/plain
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: THIRD_PARTY_NOTICES.md
      role: Frozen third-party wheel inventory
      media_type: text/markdown
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: vendor/wheels/*.whl
      role: Frozen offline Python wheel closure
      media_type: application/zip
      validation_profile: wheel_v1
      min_count: 1
      max_count: 256
      executable: false
    allow_extra_files: true
    entrypoints:
    - run.sh
    runnable: true
    smoke_command:
    - ./run.sh
    smoke_timeout_seconds: 60
    require_offline_wheelhouse: true
    runtime_python_entrypoint: build_deck.py
    limits:
      max_files: 512
      max_total_bytes: 268435456
      max_file_bytes: 67108864
      max_depth: 12
      max_path_bytes: 240
capability:
  statement: '用户目标：我有季度指标的 JSON 和一份要点笔记，想生成一套能直接汇报的幻灯片，再附一份讲稿。

    公开行为承诺：

    - [one-title-slide] 生成的 out/quarterly_report.pptx 的第一张幻灯片为标题页，其标题占位文本等于输入 JSON
    的 deck_title，副标题包含 quarter 值。

    - [one-slide-per-metric] 每条输入指标对应一张内容幻灯片，位于标题页之后，指标幻灯片数量等于输入 metrics 数组长度，且幻灯片按指标
    name 升序排列。

    - [metric-slide-body-text] 每张指标幻灯片的标题占位文本等于该指标的 name，正文包含拼接后的 value 与 unit（形如“value
    unit”，unit 为空时仅含 value）。

    - [speaker-notes-mirror-notes] out/speaker_notes.txt 的正文按输入 notes 数组顺序逐条列出每条要点笔记（每条一行）；当
    notes 为空时讲稿包含固定占位行“（无要点笔记）”。

    公开产物协议：

    - [title-slide -> one-title-slide] 定位：用 pptx.Presentation 打开 out/quarterly_report.pptx，取
    slides[0]；读取其标题占位符 (shapes.title) 文本与副标题占位符文本。；值表示：标题占位文本为 UTF-8 字符串，等于 deck_title；副标题为包含
    quarter 子串的 UTF-8 字符串。

    - [metric-slide-count-and-order -> one-slide-per-metric] 定位：用 pptx.Presentation
    打开 pptx，取 slides[1:]，即标题页之后的所有幻灯片，按幻灯片顺序读取各自标题占位文本。；值表示：内容幻灯片数量为整数，等于输入 metrics
    长度；标题占位文本序列为按 name 升序的 UTF-8 字符串序列。

    - [metric-slide-body -> metric-slide-body-text] 定位：对 slides[1:] 中的每一张，读取标题占位文本以及非标题正文占位符/文本框中的合并文本。；值表示：标题为等于指标
    name 的 UTF-8 字符串；正文为包含子串 value（unit 非空时再包含空格加 unit）的 UTF-8 字符串。

    - [speaker-notes-lines -> speaker-notes-mirror-notes] 定位：以 UTF-8 读取 out/speaker_notes.txt，按换行拆分为行。；值表示：若
    notes 非空，则存在与 notes 逐条对应、顺序一致的行；若 notes 为空，则存在固定行“（无要点笔记）”。

    统一运行语义：当输入不属于公开承诺定义的有效域时抛 UserInputError（CLI exit 1）；相同输入重复运行得到逐字节一致的结果；运行期完全离线。'
  output_schema: QuarterlyDeckWorkspace
  intent_contract:
    schema_version: 1
    user_goal: 我有季度指标的 JSON 和一份要点笔记，想生成一套能直接汇报的幻灯片，再附一份讲稿。
    user_goal_sha256: 549f48fd5e11e846a27b897bac3805ba5104192d70900a0be19a966f5967ebc2
    commitments:
    - commitment_id: one-title-slide
      public_text: 生成的 out/quarterly_report.pptx 的第一张幻灯片为标题页，其标题占位文本等于输入 JSON 的 deck_title，副标题包含
        quarter 值。
      rationale: 用户要一套能直接汇报的幻灯片，标题页需反映主题与季度。
      origin: MODEL_PROPOSED
    - commitment_id: one-slide-per-metric
      public_text: 每条输入指标对应一张内容幻灯片，位于标题页之后，指标幻灯片数量等于输入 metrics 数组长度，且幻灯片按指标 name 升序排列。
      rationale: 确保每个季度指标都被完整呈现且顺序可预期。
      origin: MODEL_PROPOSED
    - commitment_id: metric-slide-body-text
      public_text: 每张指标幻灯片的标题占位文本等于该指标的 name，正文包含拼接后的 value 与 unit（形如“value unit”，unit
        为空时仅含 value）。
      rationale: 汇报者需要在每页看到指标名称与数值。
      origin: MODEL_PROPOSED
    - commitment_id: speaker-notes-mirror-notes
      public_text: out/speaker_notes.txt 的正文按输入 notes 数组顺序逐条列出每条要点笔记（每条一行）；当 notes
        为空时讲稿包含固定占位行“（无要点笔记）”。
      rationale: 用户明确要求附一份讲稿，讲稿应还原要点笔记内容。
      origin: MODEL_PROPOSED
    artifact_protocol:
      schema_version: 1
      protocol_id: quarterly-deck-workspace
      observations:
      - observation_id: title-slide
        commitment_ids:
        - one-title-slide
        locator: 用 pptx.Presentation 打开 out/quarterly_report.pptx，取 slides[0]；读取其标题占位符
          (shapes.title) 文本与副标题占位符文本。
        value_encoding: 标题占位文本为 UTF-8 字符串，等于 deck_title；副标题为包含 quarter 子串的 UTF-8 字符串。
      - observation_id: metric-slide-count-and-order
        commitment_ids:
        - one-slide-per-metric
        locator: 用 pptx.Presentation 打开 pptx，取 slides[1:]，即标题页之后的所有幻灯片，按幻灯片顺序读取各自标题占位文本。
        value_encoding: 内容幻灯片数量为整数，等于输入 metrics 长度；标题占位文本序列为按 name 升序的 UTF-8 字符串序列。
      - observation_id: metric-slide-body
        commitment_ids:
        - metric-slide-body-text
        locator: 对 slides[1:] 中的每一张，读取标题占位文本以及非标题正文占位符/文本框中的合并文本。
        value_encoding: 标题为等于指标 name 的 UTF-8 字符串；正文为包含子串 value（unit 非空时再包含空格加 unit）的
          UTF-8 字符串。
      - observation_id: speaker-notes-lines
        commitment_ids:
        - speaker-notes-mirror-notes
        locator: 以 UTF-8 读取 out/speaker_notes.txt，按换行拆分为行。
        value_encoding: 若 notes 非空，则存在与 notes 逐条对应、顺序一致的行；若 notes 为空，则存在固定行“（无要点笔记）”。
    delivery:
      profile_id: workspace_bundle_v1
      support_status: SUPPORTED
      origin: MODEL_PROPOSED
      requirements:
        inputs:
        - kind: file
          location: local
          representation: utf8_text
          format_label: JSON (指标+要点笔记)
          role: 单个 JSON 文件，含季度指标数组和每张幻灯片的要点笔记，用于驱动幻灯片与讲稿生成
        outputs:
        - kind: directory
          format_id: workspace_bundle
          format_label: 离线多文件工作区
          role: 包含生成的 .pptx 幻灯片（二进制）与配套讲稿文本的离线工作区
        network: offline
        credentials: none
        lifecycle: per_invocation
        runtime: local_cpu
        browser: none
        external_side_effects: none
      admitted_output_format_id: workspace_bundle
    confirmation:
