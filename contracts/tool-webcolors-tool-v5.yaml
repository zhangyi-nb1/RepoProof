task_id: tool-webcolors-tool-v5

source_repo:
  url: https://github.com/ubernostrum/webcolors
  revision: guided
  resolved_commit: e6392ba6eeba81b02e666eb3ed02ef2e006344c0
  license: BSD
  distribution: webcolors
  import_module: webcolors

target_project:
  kind: local_tool
  path: fixtures/tool_skeleton_webcolors-tool-v5
  package: webcolors_tool
  entry_point: webcolors-tool

requirement_spec_file: tool-webcolors-tool-v5.requirements.yaml
task_family: LOCAL-TOOL
adoption_shape: TOOL_ONBOARDING

tool: {"schema_version": 2, "name": "webcolors-tool", "summary": "将标准 CSS3 颜色名称转换为确定性的 RGB 数值，供外部灰度/颜色传感器适配层按其端口协议使用。", "interface": {"usage": "webcolors-tool <input> [--out FILE]", "input": {"kind": "file", "format": "TEXT", "contract": null}, "output": {"kind": "stdout", "format": "JSON", "contract": {"media_type": "application/json", "root_type": "object", "required": {"color_name": "string", "rgb": "object"}}}, "exit_codes": {"0": "success", "1": "user_error", "2": "internal_error"}}}

capability:
  statement: >
    读取一个 UTF-8 纯文本颜色名称，调用 webcolors 的 CSS3 颜色名称解析能力，输出该颜色对应的 8 位 RGB 通道值。输入会去除首尾空白；颜色名称按 webcolors 的 CSS3 规则解析，大小写及可接受的名称规范化完全由上游库决定。输出 JSON 固定包含 color_name（去除首尾空白后的输入名称）和 rgb（含 red、green、blue 三个 0–255 整数）；JSON 使用稳定的键排序、紧凑分隔符和 UTF-8 表示，因此重复运行结果确定。该工具只完成颜色名称到 RGB 的离线标准化，不读取摄像头、不识别图片、不连接 MSP32 或任何灰度传感器；传感器端口、阈值、反射率与 RGB 到模块电平的适配必须由调用方硬件层处理。空输入、包含换行符的输入、非 CSS3 颜色名称或其他无法解析的输入均抛出 UserInputError（退出码 1）。完全离线运行。 交付形态为标准工具包(TOOL_PACKAGE_LAYOUT):在骨架 src/webcolors_tool/impl.py 实现 extract(),必须调用 pinned webcolors;依赖锁进 requirements.lock.txt(replay 从它重建)。行为以公开样例为准(例:webcolors-tool inputs/upstream-evidence-5.txt -> 见 expected/upstream-evidence-5.expected.txt; webcolors-tool inputs/upstream-evidence-7.txt -> 见 expected/upstream-evidence-7.expected.txt; webcolors-tool inputs/typical_css3_name.txt -> 见 expected/typical_css3_name.expected.txt);坏输入抛 UserInputError(→exit 1);重复调用确定;完全离线 CPU-only。骨架锚定件(main.py/bin/build.sh/tool.json/pyproject)不可改。公开样例与可运行公开测试位于骨架 public_tests/ 下,是本合同的一部分。
  output_schema: "ColorSensorColor"

environment: {os: linux, arch: arm64, python: "3.12", cpu_only: true, network_install: true, network_test: false}

constraints:
  forbidden: [gpu, privileged_container, oracle_write, model_download, network_at_test_time]
  editable_zones: [tool]
  forbidden_install_extras: []

budgets:
  max_agent_steps: 20
  max_wall_time_minutes: 30
  max_command_minutes: 5
  max_semantic_recoveries: 3
  max_same_action: 2
  max_patch_files: 12
  max_patch_lines: 600
  max_input_tokens_total: 400000
  max_output_tokens_total: 40000
  monetary_soft_cap_usd: 5.0

acceptance:
  capability_command: ["pytest", "-q", "/oracle/test_capability.py"]
  regression_command: ["pytest", "-q", "public_tests/test_interface_contract.py"]
  probe_script: direct_tool_probe.py
