tool: {"schema_version": 2, "name": "markdown-it-py-tool", "summary": "读取 UTF-8 Markdown 文件并使用 markdown-it-py 4.2.0 提取标题、链接与围栏代码块，输出确定性 JSON 对象。", "interface": {"usage": "markdown-it-py-tool <input> [--out FILE]", "input": {"kind": "file", "format": "Markdown", "contract": null}, "output": {"kind": "stdout", "format": "JSON", "contract": {"media_type": "application/json", "root_type": "object", "required": {"headings": "array", "links": "array", "code_blocks": "array"}}}, "exit_codes": {"0": "success", "1": "user_error", "2": "internal_error"}}}

capability:
  statement: >
    使用 markdown-it-py 4.2.0 的 MarkdownIt 解析一个 UTF-8 Markdown 文件，并输出对象 {"headings": [...], "links": [...], "code_blocks": [...]}。headings 按文档中标题出现顺序输出，每项为 {"level": 整数, "text": 字符串}；仅处理 markdown-it-py 产生的 heading_open 标记，level 取 h1 至 h6 的数字。标题 text 由其紧随的 inline 标记子项组成：拼接 text 与 code_inline 的 content，softbreak 与 hardbreak 规范化为单个 \n，Markdown 格式控制标记不输出，链接标题文本会作为其可见文本的一部分。links 按行内链接出现顺序输出，每项为 {"href": 字符串, "text": 字符串}；href 取 link_open 标记的 href 属性，text 按相同的行内纯文本规则收集链接开始和结束标记之间的文本与行内代码，换行标记为 \n。code_blocks 按出现顺序仅输出围栏代码块（fence），每项为 {"language": 字符串, "code": 字符串}；language 是围栏 info 字段按空白切分后的第一个词，无 info 时为空字符串；code 是解析器提供的 content，保留其内容与末尾换行。普通段落、列表、引用、表格、图片、HTML、缩进代码块及其他未列出的标记均忽略。文件通过 UTF-8 文本读取，Python 的通用换行读取会将 CRLF/CR 规范化为 LF；输出使用 UTF-8 JSON、固定顶层字段顺序 headings、links、code_blocks，并使用紧凑分隔符。空文件或仅含空白的文件，以及无法读取、不是有效 UTF-8 或解析期间发生输入错误的文件，均抛出 UserInputError（CLI 退出码 1）。Markdown 的语法宽容性遵循 markdown-it-py：未触发解析器异常的 Markdown 仍按其解析结果处理。重复运行在相同输入和相同依赖版本下完全确定性，且全过程完全离线。 交付形态为标准工具包(TOOL_PACKAGE_LAYOUT):在骨架 src/markdown_it_py_tool/impl.py 实现 extract(),必须调用 pinned markdown-it-py;依赖锁进 requirements.lock.txt(replay 从它重建)。行为以公开样例为准(例:markdown-it-py-tool inputs/typical_unicode_features.md -> 见 expected/typical_unicode_features.expected.txt; markdown-it-py-tool inputs/malformed_markdown.md -> 见 expected/malformed_markdown.expected.txt);坏输入抛 UserInputError(→exit 1);重复调用确定;完全离线 CPU-only。骨架锚定件(main.py/bin/build.sh/tool.json/pyproject)不可改。公开样例与可运行公开测试位于骨架 public_tests/ 下,是本合同的一部分。
  output_schema: "MarkdownDocumentExtraction"

environment: {os: linux, arch: arm64, python: "3.12", cpu_only: true, network_install: true, network_test: false}

constraints:
  forbidden: [gpu, privileged_container, oracle_write, model_download, network_at_test_time]
  editable_zones: [tool]
  forbidden_install_extras: []

budgets:
  max_agent_steps: 20
  max_wall_time_minutes: 30
  max_command_minutes: 5
  max_semantic_recoveries: 3
  max_same_action: 2
  max_patch_files: 12
  max_patch_lines: 600
  max_input_tokens_total: 400000
  max_output_tokens_total: 40000
  monetary_soft_cap_usd: 5.0

acceptance:
  capability_command: ["pytest", "-q", "/oracle/test_capability.py"]
  regression_command: ["pytest", "-q", "public_tests/test_interface_contract.py"]
  probe_script: direct_tool_probe.py
