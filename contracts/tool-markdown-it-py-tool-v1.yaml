task_id: tool-markdown-it-py-tool-v1

source_repo:
  url: https://github.com/executablebooks/markdown-it-py
  revision: guided
  resolved_commit: 36c5f547144df2d01970a5792d68c71a3380b227
  license: MIT
  distribution: markdown-it-py
  import_module: markdown_it

target_project:
  kind: local_tool
  path: fixtures/tool_skeleton_markdown-it-py-tool
  package: markdown_it_py_tool
  entry_point: markdown-it-py-tool

requirement_spec_file: tool-markdown-it-py-tool-v1.requirements.yaml
task_family: LOCAL-TOOL
adoption_shape: TOOL_ONBOARDING

tool: {"schema_version": 2, "name": "markdown-it-py-tool", "summary": "解析 UTF-8 Markdown，并按源码顺序生成包含标题、链接与 fenced code block 的确定性结构化 JSON。", "interface": {"usage": "markdown-it-py-tool <input> [--out FILE]", "input": {"kind": "file", "format": "Markdown (UTF-8)", "contract": null}, "output": {"kind": "stdout", "format": "JSON", "contract": {"media_type": "application/json", "root_type": "object", "required": {"headings": "array", "links": "array", "code_blocks": "array"}}}, "exit_codes": {"0": "success", "1": "user_error", "2": "internal_error"}}}

capability:
  statement: >
    使用 markdown-it-py 4.2.0 解析 UTF-8 Markdown。输出对象固定包含 headings、links、code_blocks 三个数组；每项都包含从 0 开始、按源码扫描顺序递增的 order。headings 每项包含 level 与去除 Markdown 标记后的 text；links 每项包含 label 与 target，保留相对/绝对目标和重复标签；code_blocks 只收集 fenced code block，每项包含 language 与 content，language 缺失时为空字符串。解析器绝不执行代码。无法读取、非 UTF-8 或空白输入抛出 UserInputError。相同输入重复运行必须产生字节一致、UTF-8、键排序的紧凑 JSON，并且完全离线。 交付形态为标准工具包(TOOL_PACKAGE_LAYOUT):在骨架 src/markdown_it_py_tool/impl.py 实现 extract(),必须调用 pinned markdown-it-py;依赖锁进 requirements.lock.txt(replay 从它重建)。行为以公开样例为准(例:markdown-it-py-tool inputs/typical_mixed.md -> 见 expected/typical_mixed.expected.txt; markdown-it-py-tool inputs/malformed_unicode.md -> 见 expected/malformed_unicode.expected.txt);坏输入抛 UserInputError(→exit 1);重复调用确定;完全离线 CPU-only。骨架锚定件(main.py/bin/build.sh/tool.json/pyproject)不可改。公开样例与可运行公开测试位于骨架 public_tests/ 下,是本合同的一部分。
  output_schema: "MarkdownStructure"

environment: {os: linux, arch: arm64, python: "3.12", cpu_only: true, network_install: true, network_test: false}

constraints:
  forbidden: [gpu, privileged_container, oracle_write, model_download, network_at_test_time]
  editable_zones: [tool]
  forbidden_install_extras: []

budgets:
  max_agent_steps: 20
  max_wall_time_minutes: 30
  max_command_minutes: 5
  max_semantic_recoveries: 3
  max_same_action: 2
  max_patch_files: 12
  max_patch_lines: 600
  max_input_tokens_total: 400000
  max_output_tokens_total: 40000
  monetary_soft_cap_usd: 5.0

acceptance:
  capability_command: ["pytest", "-q", "/oracle/test_capability.py"]
  regression_command: ["pytest", "-q", "public_tests/test_interface_contract.py"]
  probe_script: direct_tool_probe.py
