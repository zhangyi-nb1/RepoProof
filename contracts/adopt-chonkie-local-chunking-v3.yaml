# Adoption Contract v3 — FROZEN. Agents may change their solution,
# never this problem statement, the hard constraints, or the oracle.
# Integrity: .sha256 sidecar + .package.json (task package root hash
# binding contract, oracle tree, public fixture, runtime-held-out
# fixture, test-collection manifest, consumer tree, source commit/tree,
# wheelhouse root, image digest, environment constraints, acceptance).
#
# v1/v2 stay frozen as history; this file does not modify them.
#
# capability.params are FROZEN FROM THE PINNED UPSTREAM API and were
# CALIBRATED by really running the pinned wheel in the pinned container
# (see oracle fixtures/reference_partitions.json provenance):
#   SentenceChunker(tokenizer="character", chunk_size, chunk_overlap=0, ...)
#   RecursiveChunker(tokenizer="character", chunk_size, ...)  # NO chunk_overlap
# chunk_overlap applies to the sentence strategy ONLY. No parameter is
# declared that the pinned upstream does not support.
#
# Calibrated post-processing rules (deterministic, oracle-enforced):
#   R1: whitespace-only documents yield ZERO records regardless of raw
#       upstream output (recursive natively emits one whitespace chunk).
#   R2: an indivisible sentence longer than chunk_size is preserved
#       verbatim (sentence strategy may legitimately exceed chunk_size;
#       the adapter must NOT re-split; units always == char span).
#
# The held-out fixture set is runtime-held-out: not visible to the
# agent at run time (oracle is never mounted into agent containers).
#
# Deliberately absent: any expected-outcome label.

task_id: adopt-chonkie-local-chunking-v3

source_repo:
  url: https://github.com/feyninc/chonkie
  revision: v1.7.0
  resolved_commit: 0a6baea1a42c9afe9b3bc31ecb37739e744bb1ec
  license: MIT

target_project:
  kind: consumer_fixture
  path: fixtures/consumer_rag

capability:
  statement: >
    Adopt Chonkie's offline chunking into the local RAG consumer:
    rag_consumer.chunk_documents(request) must honor request-level
    strategy selection ("sentence" | "recursive") with the frozen
    parameters, and return host-schema ChunkRecord rows whose core
    chunk text/order/boundaries come from the pinned Chonkie for the
    requested strategy. Host-side translation is allowed for ids,
    schema and metadata; boundaries are not negotiable. Rules R1
    (blank documents -> zero records) and R2 (preserve indivisible
    over-size chunks verbatim) apply. Stable non-upstream chunk ids,
    document order, contiguous ordinals, offsets that slice back,
    metadata passthrough, wrapped upstream errors — fully offline,
    CPU-only.
  output_schema: ChunkRecord
  params:
    strategies: [sentence, recursive]
    tokenizer: character
    chunk_size: 120
    chunk_overlap: 0
  units_semantics: >
    units = chunk length in characters (tokenizer="character") and
    MUST equal char_end - char_start for every record, including R2
    over-size indivisible chunks.

environment:
  os: linux
  arch: arm64
  python: "3.12"
  cpu_only: true
  network_install: true
  network_test: false

constraints:
  forbidden:
    - gpu
    - privileged_container
    - oracle_write
    - model_download
    - embedding_calls
    - network_at_test_time
  editable_zones:
    - adaptation
  forbidden_install_extras:
    - "[all]"
    - "[semantic]"
    - "[neural]"
    - "[late]"
    - "[slumber]"
    - "[st]"
    - sentence-transformers
    - torch
    - openai
    - google-genai
    - gemini
    - qdrant
    - chromadb
    - pgvector
    - weaviate

budgets:
  max_agent_steps: 20
  max_wall_time_minutes: 30
  max_command_minutes: 5
  max_semantic_recoveries: 3
  max_same_action: 2
  max_patch_files: 8
  max_patch_lines: 400
  max_input_tokens_total: 250000
  max_output_tokens_total: 30000
  monetary_soft_cap_usd: 5.0

acceptance:
  capability_command: ["pytest", "-q", "/oracle/test_capability.py"]
  regression_command: ["pytest", "-q", "/oracle/test_regression.py"]
