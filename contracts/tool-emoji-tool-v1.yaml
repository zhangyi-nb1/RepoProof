task_id: tool-emoji-tool-v1

source_repo:
  url: https://github.com/carpedm20/emoji
  revision: guided
  resolved_commit: d26c675190a6b6c0edee959d7b896721a9c3641d
  license: BSD
  distribution: emoji
  import_module: emoji

target_project:
  kind: local_tool
  path: fixtures/tool_skeleton_emoji-tool
  package: emoji_tool
  entry_point: emoji-tool

requirement_spec_file: tool-emoji-tool-v1.requirements.yaml
task_family: LOCAL-TOOL
adoption_shape: TOOL_ONBOARDING

tool: {"name": "emoji-tool", "summary": "将 UTF-8 文本文档中的 emoji 离线转换为 :name: 形式的别名。", "interface": {"usage": "emoji-tool <input> [--out FILE]", "input": {"kind": "file", "format": "TXT"}, "output": {"kind": "stdout", "format": "TXT"}, "exit_codes": {"0": "success", "1": "user_error", "2": "internal_error"}}}

capability:
  statement: >
    读取一个本地 UTF-8 纯文本文件，将其中所有由 upstream Python 库 emoji 识别的 emoji 字符转换为 CLDR 短名称别名，默认格式为英文冒号包围的 :name:。非 emoji 文本、空白、换行、标点和原有的 :name: 文本保持原样；连续 emoji 按原顺序逐个转换；包含肤色、性别、ZWJ 序列、变体选择符或旗帜的 emoji 按 emoji.demojize 的规范名称归一化输出。输出为转换后的完整文本字符串，不额外添加标题、JSON 包装或解释；若原文件末尾有换行，按库处理后的文本保留对应换行。输入必须是存在的非空 UTF-8 文本文件；路径不可读、目录、空文件、仅无法解码的内容或其他 malformed input 均 raise UserInputError 并由 CLI 映射为 exit 1。重复运行在相同输入和相同 pinned emoji 版本下结果确定；工具完全离线运行，不访问网络。 交付形态为标准工具包(TOOL_PACKAGE_LAYOUT):在骨架 src/emoji_tool/impl.py 实现 extract(),必须调用 pinned emoji;依赖锁进 requirements.lock.txt(replay 从它重建)。行为以公开样例为准(例:emoji-tool inputs/e1.txt -> 见 expected/e1.txt; emoji-tool inputs/e2.txt -> 见 expected/e2.txt);坏输入抛 UserInputError(→exit 1);重复调用确定;完全离线 CPU-only。骨架锚定件(main.py/bin/build.sh/tool.json/pyproject)不可改。公开样例与可运行公开测试位于骨架 public_tests/ 下,是本合同的一部分。
  output_schema: TXT

environment: {os: linux, arch: arm64, python: "3.12", cpu_only: true, network_install: true, network_test: false}

constraints:
  forbidden: [gpu, privileged_container, oracle_write, model_download, network_at_test_time]
  editable_zones: [tool]
  forbidden_install_extras: []

budgets:
  max_agent_steps: 20
  max_wall_time_minutes: 30
  max_command_minutes: 5
  max_semantic_recoveries: 3
  max_same_action: 2
  max_patch_files: 12
  max_patch_lines: 600
  max_input_tokens_total: 400000
  max_output_tokens_total: 40000
  monetary_soft_cap_usd: 5.0

acceptance:
  capability_command: ["pytest", "-q", "/oracle/test_capability.py"]
  regression_command: ["pytest", "-q", "public_tests/test_interface_contract.py"]
  probe_script: direct_tool_probe.py
