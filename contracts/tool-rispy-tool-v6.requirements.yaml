task_id: tool-rispy-tool-v6

controls:
  positive: controls/tool-rispy-tool-v6/positive
  negatives:
    - path: controls/tool-rispy-tool-v6/negative_empty
      label: NC_empty
      must_fail_nodes: ["test_example"]
    - path: controls/tool-rispy-tool-v6/negative_hardcode
      label: NC_hardcode
      must_fail_nodes: ["test_held_example"]
    - path: controls/tool-rispy-tool-v6/negative_badexit
      label: NC_badexit
      must_fail_nodes: ["test_malformed_input_is_user_error"]
  # NC_reimpl(零 import 上游)不在此表:它在 oracle 上全绿,判死属
  # provenance 层(runner 验证阶段执法;harness 测试喂它自证查得出)。
  # 见 TOOL_READY_GATE §五。目录:controls/tool-rispy-tool-v6/negative_reimpl

requirements:
  - id: satisfy-user-examples
    owner: ADAPTER
    severity: HARD
    source_field: capability.statement
    public_text: >
      调用 pinned rispy 实现能力,使全部用户样例断言通过
      (行为以公开样例为准,例:rispy-tool inputs/typical_with_exact_duplicate.ris -> 见 expected/typical_with_exact_duplicate.expected.txt; rispy-tool inputs/unicode_and_similar_records.ris -> 见 expected/unicode_and_similar_records.expected.txt)。
    examples:
      - "rispy-tool inputs/typical_with_exact_duplicate.ris -> 见 expected/typical_with_exact_duplicate.expected.txt; rispy-tool inputs/unicode_and_similar_records.ris -> 见 expected/unicode_and_similar_records.expected.txt"
    oracle_nodes:
      - "test_capability::test_example_1"
      - "test_capability::test_example_2"
      - "test_capability::test_held_example_1"
  - id: interface-contract
    owner: ADAPTER
    severity: HARD
    source_field: capability.statement
    public_text: >
      坏输入内容抛 UserInputError(骨架转 exit 1);不得让异常裸奔到
      兜底层(exit 2);重复调用同一输入输出逐字节一致;成功路径不向
      stderr 泄漏 traceback。
    examples:
      - "exit: 0=成功 1=用户错误 2=内部错误"
    oracle_nodes:
      - "test_capability::test_malformed_input_is_user_error"
      - "test_capability::test_deterministic_output"
      - "test_capability::test_stdout_purity_on_success"
  - id: skeleton-anchors-untouched
    owner: HOST_INPUT_GUARD
    severity: HARD
    source_field: capability.statement
    public_text: >
      骨架锚定件(main.py / bin/ / build.sh / tool.json / pyproject.toml)
      与其 argparse/输入存在检查/exit 语义由 harness 预置,不可修改,
      不计 agent 能力。
    examples:
      - "rispy-tool --help -> usage"
    oracle_nodes:
      - "test_interface_contract::test_help_reachable"
      - "test_interface_contract::test_missing_input_is_user_error"
  - id: intent-parse-ris-input
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "将输入作为 UTF-8 RIS 文献文件，并使用固定版本 rispy 的 RIS 解析接口读取记录。"
    examples: []
    verified_by: semantic-verifier:rispy-tool-semantic-v1
  - id: intent-exact-semantic-deduplication
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "两条记录仅在 rispy 解析后其全部字段名、字段值及列表值顺序均相同时，才视为明确重复；每组只保留首次出现的记录。"
    examples: []
    verified_by: semantic-verifier:rispy-tool-semantic-v1
  - id: intent-encounter-order-preserved
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "去重后的记录顺序与各保留记录在输入中的首次出现顺序一致。"
    examples: []
    verified_by: semantic-verifier:rispy-tool-semantic-v1
  - id: intent-no-enrichment-or-field-alteration
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "每条输出记录经 rispy 解析后的字段内容，等于对应保留的输入首次记录；不会联网查询、补充或改写作者、题名、年份等书目信息。"
    examples: []
    verified_by: semantic-verifier:rispy-tool-semantic-v1
  - id: intent-unicode-field-preservation
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "保留记录中的中文及其他 Unicode 字段值在输出经 rispy 解析后与输入相同。"
    examples: []
    verified_by: semantic-verifier:rispy-tool-semantic-v1
  - id: intent-ris-record-only-output
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "输出只包含完整的 RIS 记录：每条记录以 TY 字段开始并以 ER 字段结束，不保留 rispy 序列化可能附加的记录序号或记录外标题行。"
    examples: []
    verified_by: semantic-verifier:rispy-tool-semantic-v1

