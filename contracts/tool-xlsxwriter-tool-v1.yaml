      rationale: 审计人员可在工作簿内追溯每一条源台账记录。
      origin: MODEL_PROPOSED
    - commitment_id: summary-metrics
      public_text: Summary 表列出发票数量、发票金额合计、付款金额合计、未匹配付款数量和缺失科目数量；金额合计分别基于 invoices.csv
        的 amount 列和 payments.csv 的 amount 列。
      rationale: 提供期间规模、金额和关键异常数量的审计总览。
      origin: MODEL_PROPOSED
    - commitment_id: exception-detection
