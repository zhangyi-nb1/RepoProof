        invoice_id 的第二次及后续出现。
      rationale: 将付款匹配、科目完整性和重复发票号风险集中暴露。
      origin: MODEL_PROPOSED
    - commitment_id: exception-order
      public_text: Exceptions 表先列出未匹配付款，再列出缺失科目，最后列出重复发票；每一类内部按其源 CSV 的数据行顺序排列，并记录源工作表和源
        CSV 行号。
      rationale: 使审计复核定位稳定且可回溯。
      origin: MODEL_PROPOSED
    - commitment_id: exception-highlighting
      public_text: Exceptions 表的每条异常记录在 A:E 列均以红色系填充突出显示。
      rationale: 满足异常标红的审计交付要求。
      origin: MODEL_PROPOSED
    artifact_protocol:
