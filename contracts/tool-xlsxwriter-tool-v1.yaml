        locator: 在 audit_workbook.xlsx 的 Summary 工作表中，读取 A1:B6。
        value_encoding: 二维表：第 1 行为 Metric、Value；第 2 至第 6 行的 Metric 依次为 Invoice count、Invoice
          total、Payment total、Unmatched payment count、Missing account count；各 Value
          分别为整数或十进制数值。
      - observation_id: exception-register
        commitment_ids:
        - exception-detection
        - exception-order
        locator: 在 audit_workbook.xlsx 的 Exceptions 工作表中，读取第 1 行标题以及从第 2 行开始的所有记录。
        value_encoding: 标题固定为 ErrorType、SourceSheet、SourceRow、Key、Detail；每条记录编码为五个字符串单元格。记录先按
          ErrorType 的顺序 Unmatched payment、Missing account、Duplicate invoice 排列，再按对应输入
          CSV 的数据行序排列。
      - observation_id: exception-row-style
        commitment_ids:
        - exception-highlighting
        locator: 在 audit_workbook.xlsx 的 Exceptions 工作表中，检查每个非标题记录行 A:E 的单元格填充格式。
        value_encoding: 每个异常记录行的 A:E 单元格均使用红色系实心填充格式；无异常记录时该表只有标题行。
    delivery:
