task_id: tool-biopython-tool-v1

controls:
  positive: controls/tool-biopython-tool-v1/positive
  negatives:
    - path: controls/tool-biopython-tool-v1/negative_empty
      label: NC_empty
      must_fail_nodes: ["test_example"]
    - path: controls/tool-biopython-tool-v1/negative_hardcode
      label: NC_hardcode
      must_fail_nodes: ["test_held_example"]
    - path: controls/tool-biopython-tool-v1/negative_badexit
      label: NC_badexit
      must_fail_nodes: ["test_malformed_input_is_user_error"]
  # NC_reimpl(零 import 上游)不在此表:它在 oracle 上全绿,判死属
  # provenance 层(runner 验证阶段执法;harness 测试喂它自证查得出)。
  # 见 TOOL_READY_GATE §五。目录:controls/tool-biopython-tool-v1/negative_reimpl

requirements:
  - id: satisfy-user-examples
    owner: ADAPTER
    severity: HARD
    source_field: capability.statement
    public_text: >
      调用 pinned biopython 实现能力,使全部用户样例断言通过
      (行为以公开样例为准,例:biopython-tool inputs/typical_mixed_quality-2.fastq -> 见 expected/typical_mixed_quality-2.expected.txt; biopython-tool inputs/zero_length_read.fastq -> 见 expected/zero_length_read.expected.txt; biopython-tool inputs/unicode_header.fastq -> 见 expected/unicode_header.expected.txt)。
    examples:
      - "biopython-tool inputs/typical_mixed_quality-2.fastq -> 见 expected/typical_mixed_quality-2.expected.txt; biopython-tool inputs/zero_length_read.fastq -> 见 expected/zero_length_read.expected.txt; biopython-tool inputs/unicode_header.fastq -> 见 expected/unicode_header.expected.txt"
    oracle_nodes:
      - "test_capability::test_example_1"
      - "test_capability::test_example_2"
      - "test_capability::test_example_3"
      - "test_capability::test_held_example_1"
  - id: interface-contract
    owner: ADAPTER
    severity: HARD
    source_field: capability.statement
    public_text: >
      坏输入内容抛 UserInputError(骨架转 exit 1);不得让异常裸奔到
      兜底层(exit 2);重复调用同一输入输出逐字节一致;成功路径不向
      stderr 泄漏 traceback。
    examples:
      - "exit: 0=成功 1=用户错误 2=内部错误"
    oracle_nodes:
      - "test_capability::test_malformed_input_is_user_error"
      - "test_capability::test_deterministic_output"
      - "test_capability::test_stdout_purity_on_success"
  - id: skeleton-anchors-untouched
    owner: HOST_INPUT_GUARD
    severity: HARD
    source_field: capability.statement
    public_text: >
      骨架锚定件(main.py / bin/ / build.sh / tool.json / pyproject.toml)
      与其 argparse/输入存在检查/exit 语义由 harness 预置,不可修改,
      不计 agent 能力。
    examples:
      - "biopython-tool --help -> usage"
    oracle_nodes:
      - "test_interface_contract::test_help_reachable"
      - "test_interface_contract::test_missing_input_is_user_error"
  - id: intent-fastq-record-count
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "报告的 read-count 等于使用 Biopython 的 Bio.SeqIO.parse(输入流, \"fastq\") 成功解析出的 FASTQ 读段记录数。"
    examples: []
    verified_by: semantic-verifier:biopython-tool-semantic-v1
  - id: intent-total-base-count
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "报告的 total-base-count 等于所有经 Bio.SeqIO.parse(输入流, \"fastq\") 解析的记录中序列长度之和。"
    examples: []
    verified_by: semantic-verifier:biopython-tool-semantic-v1
  - id: intent-read-length-summary
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "报告的 minimum-read-length 与 maximum-read-length 分别是解析记录序列长度的最小值和最大值；mean-read-length 是总碱基数除以读段数，并以十进制银行家舍入法保留两位小数。"
    examples: []
    verified_by: semantic-verifier:biopython-tool-semantic-v1
  - id: intent-mean-phred-quality
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "报告的 mean-phred-quality 是所有解析记录的 letter_annotations[\"phred_quality\"] 数值之和除以总碱基数，并以十进制银行家舍入法保留两位小数；若读段存在但总碱基数为零，则显示 not-applicable。"
    examples: []
    verified_by: semantic-verifier:biopython-tool-semantic-v1
  - id: intent-phred-threshold-summary
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "报告分别给出 phred_quality 大于或等于 20 和大于或等于 30 的碱基计数，以及各自占总碱基数的百分比；百分比按十进制银行家舍入法保留两位小数，若总碱基数为零则百分比显示 not-applicable。"
    examples: []
    verified_by: semantic-verifier:biopython-tool-semantic-v1

