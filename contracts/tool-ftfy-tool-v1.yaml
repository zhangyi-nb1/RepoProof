task_id: tool-ftfy-tool-v1

source_repo:
  url: https://github.com/LuminosoInsight/python-ftfy
  revision: guided
  resolved_commit: 5340af6746ff655a9cd7cb2b50c2fd0b35bb91d3
  license: Apache-2.0
  distribution: ftfy
  import_module: ftfy

target_project:
  kind: local_tool
  path: fixtures/tool_skeleton_ftfy-tool
  package: ftfy_tool
  entry_point: ftfy-tool

requirement_spec_file: tool-ftfy-tool-v1.requirements.yaml
task_family: LOCAL-TOOL
adoption_shape: TOOL_ONBOARDING

tool: {"name": "ftfy-tool", "summary": "修复文本文件中的 mojibake 乱码，输出修复后文本", "interface": {"usage": "ftfy-tool <input> [--out FILE]", "input": {"kind": "file", "format": "TXT"}, "output": {"kind": "stdout", "format": "TXT"}, "exit_codes": {"0": "success", "1": "user_error", "2": "internal_error"}}}

capability:
  statement: >
    将本地纯文本文件作为输入，使用 ftfy.fix_text 修复常见 mojibake 乱码、错误编码痕迹、HTML 实体和 Unicode 文本异常，并输出修复后的纯文本。输入按 UTF-8 文本读取；保留原有换行结构，输出统一为 Unicode 字符串，不额外添加标题、解释、日志或 JSON 包装。修复规则由 ftfy 的默认 TextFixerConfig 决定，包括尽量还原被错误解码的文本、规范化可安全修复的字符异常，并避免对已正常文本做不必要改写。空文件、只含空白的文件、无法按 UTF-8 解码的文件、目录路径、不存在路径或其他 malformed input 必须抛出 UserInputError 并以 exit 1 结束。重复运行必须确定性地产生相同输出；工具完全离线运行，不访问网络或外部服务。 交付形态为标准工具包(TOOL_PACKAGE_LAYOUT):在骨架 src/ftfy_tool/impl.py 实现 extract(),必须调用 pinned ftfy;依赖锁进 requirements.lock.txt(replay 从它重建)。行为以公开样例为准(例:ftfy-tool --help -> 'contains:usage'; ftfy-tool quotes.txt -> 见 quotes.expected.txt; ftfy-tool accents.txt -> 'contains:Café résumé naïve');坏输入抛 UserInputError(→exit 1);重复调用确定;完全离线 CPU-only。骨架锚定件(main.py/bin/build.sh/tool.json/pyproject)不可改。公开样例与可运行公开测试位于骨架 public_tests/ 下,是本合同的一部分。
  output_schema: TXT

environment: {os: linux, arch: arm64, python: "3.12", cpu_only: true, network_install: true, network_test: false}

constraints:
  forbidden: [gpu, privileged_container, oracle_write, model_download, network_at_test_time]
  editable_zones: [tool]
  forbidden_install_extras: []

budgets:
  max_agent_steps: 20
  max_wall_time_minutes: 30
  max_command_minutes: 5
  max_semantic_recoveries: 3
  max_same_action: 2
  max_patch_files: 12
  max_patch_lines: 600
  max_input_tokens_total: 400000
  max_output_tokens_total: 40000
  monetary_soft_cap_usd: 5.0

acceptance:
  capability_command: ["pytest", "-q", "/oracle/test_capability.py"]
  regression_command: ["pytest", "-q", "public_tests/test_interface_contract.py"]
  probe_script: direct_tool_probe.py
