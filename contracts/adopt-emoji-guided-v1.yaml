task_id: adopt-emoji-guided-v1

source_repo:
  url: https://github.com/carpedm20/emoji
  revision: guided
  resolved_commit: d26c675190a6b6c0edee959d7b896721a9c3641d
  license: BSD
  distribution: emoji
  import_module: emoji

target_project:
  kind: consumer_fixture
  path: fixtures/assembled_emoji
  package: user_capability
  entry_point: run

requirement_spec_file: adopt-emoji-guided-v1.requirements.yaml

capability:
  statement: >
    为我的笔记项目引入 emoji 转文字能力:输入含 emoji 的文本,输出把每个 emoji 替换为 :名称: 形式的纯文本;不含 emoji 的文本原样返回 交付 /adaptation/adapter.py,暴露 run(value) 单函数,必须调用 pinned emoji 实现该能力;行为以公开样例为准(例:run('I ❤️ Python') -> 'I :red_heart: Python'; run('会议 👍 顺利') -> '会议 :thumbs_up: 顺利'; run('no emoji here') -> 'no emoji here');重复调用确定;完全离线 CPU-only。公开样例与可运行公开测试位于 /consumer 下,是本合同的一部分。
  output_schema: UserExampleOutcome

environment: {os: linux, arch: arm64, python: "3.12", cpu_only: true, network_install: true, network_test: false}

constraints:
  forbidden: [gpu, privileged_container, oracle_write, model_download, network_at_test_time]
  editable_zones: [adaptation]
  forbidden_install_extras: []

budgets:
  max_agent_steps: 20
  max_wall_time_minutes: 30
  max_command_minutes: 5
  max_semantic_recoveries: 3
  max_same_action: 2
  max_patch_files: 8
  max_patch_lines: 400
  max_input_tokens_total: 400000
  max_output_tokens_total: 40000
  monetary_soft_cap_usd: 5.0

acceptance:
  capability_command: ["pytest", "-q", "/oracle/test_capability.py"]
  regression_command: ["pytest", "-q", "/oracle/test_regression.py"]
  probe_script: direct_frontmatter_probe_v2.py
