tool: {"schema_version": 3, "name": "biopython-tool", "summary": "将单份原始 FASTQ 测序读段文件离线解析为自包含 HTML 质量概览报告。", "interface": {"usage": "biopython-tool <input> [--out FILE]", "input": {"kind": "file", "format": "FASTQ 测序读段文件", "contract": null}, "output": {"kind": "stdout", "format": "HTML", "contract": {"media_type": "text/html", "root_type": "text", "required": {}, "validation_profile": "safe_self_contained_xhtml_v1"}}, "exit_codes": {"0": "success", "1": "user_error", "2": "internal_error"}}}

capability:
  statement: "用户目标：同学交来一份原始 FASTQ 测序数据，你想先快速判断整体读段质量是否大致正常，并把结果直接打开查看。每次输入一份 FASTQ 测序读段文件，输出一份自包含 HTML 报告（.html）；完全离线、每次调用独立运行。主要边界是只做原始读段的质量概览，不进行过滤、剪切、比对或生物学解释。\n公开行为承诺：\n- [fastq-record-count] 报告的 read-count 等于使用 Biopython 的 Bio.SeqIO.parse(输入流, \"fastq\") 成功解析出的 FASTQ 读段记录数。\n- [total-base-count] 报告的 total-base-count 等于所有经 Bio.SeqIO.parse(输入流, \"fastq\") 解析的记录中序列长度之和。\n- [read-length-summary] 报告的 minimum-read-length 与 maximum-read-length 分别是解析记录序列长度的最小值和最大值；mean-read-length 是总碱基数除以读段数，并以十进制银行家舍入法保留两位小数。\n- [mean-phred-quality] 报告的 mean-phred-quality 是所有解析记录的 letter_annotations[\"phred_quality\"] 数值之和除以总碱基数，并以十进制银行家舍入法保留两位小数；若读段存在但总碱基数为零，则显示 not-applicable。\n- [phred-threshold-summary] 报告分别给出 phred_quality 大于或等于 20 和大于或等于 30 的碱基计数，以及各自占总碱基数的百分比；百分比按十进制银行家舍入法保留两位小数，若总碱基数为零则百分比显示 not-applicable。\n公开产物协议：\n- [read-count -> fastq-record-count] 定位：XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='read-count']；值表示：ASCII unsigned base-10 integer with one or more digits.\n- [total-base-count -> total-base-count] 定位：XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='total-base-count']；值表示：ASCII unsigned base-10 integer with one or more digits.\n- [minimum-read-length -> read-length-summary] 定位：XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='minimum-read-length']；值表示：ASCII unsigned base-10 integer with one or more digits.\n- [maximum-read-length -> read-length-summary] 定位：XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='maximum-read-length']；值表示：ASCII unsigned base-10 integer with one or more digits.\n- [mean-read-length -> read-length-summary] 定位：XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='mean-read-length']；值表示：ASCII fixed-point decimal with exactly two fractional digits, rounded half-even from total base count divided by read count.\n- [mean-phred-quality -> mean-phred-quality] 定位：XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='mean-phred-quality']；值表示：Either the literal not-applicable when no bases are present, or an ASCII fixed-point decimal with exactly two fractional digits, rounded half-even.\n- [q20-or-higher-base-count -> phred-threshold-summary] 定位：XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='q20-or-higher-base-count']；值表示：ASCII unsigned base-10 integer with one or more digits.\n- [q30-or-higher-base-count -> phred-threshold-summary] 定位：XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='q30-or-higher-base-count']；值表示：ASCII unsigned base-10 integer with one or more digits.\n- [q20-or-higher-percent -> phred-threshold-summary] 定位：XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='q20-or-higher-percent']；值表示：Either the literal not-applicable when no bases are present, or an ASCII fixed-point decimal with exactly two fractional digits, rounded half-even from 100 times the Q20-or-higher base count divided by total base count.\n- [q30-or-higher-percent -> phred-threshold-summary] 定位：XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='q30-or-higher-percent']；值表示：Either the literal not-applicable when no bases are present, or an ASCII fixed-point decimal with exactly two fractional digits, rounded half-even from 100 times the Q30-or-higher base count divided by total base count.\n统一运行语义：当输入不属于公开承诺定义的有效域时抛 UserInputError（CLI exit 1）；相同输入重复运行得到逐字节一致的结果；运行期完全离线。"
  output_schema: "FastqQualityHtmlReport"
  intent_contract: {"schema_version": 1, "user_goal": "同学交来一份原始 FASTQ 测序数据，你想先快速判断整体读段质量是否大致正常，并把结果直接打开查看。每次输入一份 FASTQ 测序读段文件，输出一份自包含 HTML 报告（.html）；完全离线、每次调用独立运行。主要边界是只做原始读段的质量概览，不进行过滤、剪切、比对或生物学解释。", "user_goal_sha256": "cc758a1eb79fa24821ad6f5c268fcd08db8097506daa7152783428a8e4609c86", "commitments": [{"commitment_id": "fastq-record-count", "public_text": "报告的 read-count 等于使用 Biopython 的 Bio.SeqIO.parse(输入流, \"fastq\") 成功解析出的 FASTQ 读段记录数。", "rationale": "读段数量是原始读段规模的基础概览指标。", "origin": "MODEL_PROPOSED"}, {"commitment_id": "total-base-count", "public_text": "报告的 total-base-count 等于所有经 Bio.SeqIO.parse(输入流, \"fastq\") 解析的记录中序列长度之和。", "rationale": "总碱基数说明本次原始读段数据的总体规模。", "origin": "MODEL_PROPOSED"}, {"commitment_id": "read-length-summary", "public_text": "报告的 minimum-read-length 与 maximum-read-length 分别是解析记录序列长度的最小值和最大值；mean-read-length 是总碱基数除以读段数，并以十进制银行家舍入法保留两位小数。", "rationale": "读长范围和平均读长可快速显示读段长度是否大致一致。", "origin": "MODEL_PROPOSED"}, {"commitment_id": "mean-phred-quality", "public_text": "报告的 mean-phred-quality 是所有解析记录的 letter_annotations[\"phred_quality\"] 数值之和除以总碱基数，并以十进制银行家舍入法保留两位小数；若读段存在但总碱基数为零，则显示 not-applicable。", "rationale": "所有碱基的平均 Phred 质量提供总体质量的直接概览。", "origin": "MODEL_PROPOSED"}, {"commitment_id": "phred-threshold-summary", "public_text": "报告分别给出 phred_quality 大于或等于 20 和大于或等于 30 的碱基计数，以及各自占总碱基数的百分比；百分比按十进制银行家舍入法保留两位小数，若总碱基数为零则百分比显示 not-applicable。", "rationale": "Q20 与 Q30 阈值汇总让读者能快速判断高质量碱基的整体比例。", "origin": "MODEL_PROPOSED"}], "artifact_protocol": {"schema_version": 1, "protocol_id": "fastq-quality-html-v1", "observations": [{"observation_id": "read-count", "commitment_ids": ["fastq-record-count"], "locator": "XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='read-count']", "value_encoding": "ASCII unsigned base-10 integer with one or more digits."}, {"observation_id": "total-base-count", "commitment_ids": ["total-base-count"], "locator": "XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='total-base-count']", "value_encoding": "ASCII unsigned base-10 integer with one or more digits."}, {"observation_id": "minimum-read-length", "commitment_ids": ["read-length-summary"], "locator": "XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='minimum-read-length']", "value_encoding": "ASCII unsigned base-10 integer with one or more digits."}, {"observation_id": "maximum-read-length", "commitment_ids": ["read-length-summary"], "locator": "XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='maximum-read-length']", "value_encoding": "ASCII unsigned base-10 integer with one or more digits."}, {"observation_id": "mean-read-length", "commitment_ids": ["read-length-summary"], "locator": "XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='mean-read-length']", "value_encoding": "ASCII fixed-point decimal with exactly two fractional digits, rounded half-even from total base count divided by read count."}, {"observation_id": "mean-phred-quality", "commitment_ids": ["mean-phred-quality"], "locator": "XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='mean-phred-quality']", "value_encoding": "Either the literal not-applicable when no bases are present, or an ASCII fixed-point decimal with exactly two fractional digits, rounded half-even."}, {"observation_id": "q20-or-higher-base-count", "commitment_ids": ["phred-threshold-summary"], "locator": "XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='q20-or-higher-base-count']", "value_encoding": "ASCII unsigned base-10 integer with one or more digits."}, {"observation_id": "q30-or-higher-base-count", "commitment_ids": ["phred-threshold-summary"], "locator": "XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='q30-or-higher-base-count']", "value_encoding": "ASCII unsigned base-10 integer with one or more digits."}, {"observation_id": "q20-or-higher-percent", "commitment_ids": ["phred-threshold-summary"], "locator": "XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='q20-or-higher-percent']", "value_encoding": "Either the literal not-applicable when no bases are present, or an ASCII fixed-point decimal with exactly two fractional digits, rounded half-even from 100 times the Q20-or-higher base count divided by total base count."}, {"observation_id": "q30-or-higher-percent", "commitment_ids": ["phred-threshold-summary"], "locator": "XPath: //dl[@id='fastq-quality-observations']/dd[@data-observation-id='q30-or-higher-percent']", "value_encoding": "Either the literal not-applicable when no bases are present, or an ASCII fixed-point decimal with exactly two fractional digits, rounded half-even from 100 times the Q30-or-higher base count divided by total base count."}]}, "delivery": {"profile_id": "cli_v2", "support_status": "SUPPORTED", "origin": "USER_EDITED", "requirements": {"inputs": [{"kind": "file", "location": "local", "representation": "utf8_text", "format_label": "FASTQ 测序读段文件", "role": "user-confirmed primary input"}], "outputs": [{"kind": "text_artifact", "format_id": "html", "format_label": "自包含 HTML 报告", "role": "user-confirmed primary artifact"}], "network": "offline", "credentials": "none", "lifecycle": "per_invocation", "runtime": "local_cpu"}, "admitted_output_format_id": "html"}, "confirmation": {"confirmed_by": "USER", "confirmed_at": "2026-08-30T14:46:22.879288Z", "semantics_sha256": "c3ba37edcc409f0624b108c0a78648382ae907fcd350f2b986e61a569ec935bd"}}

