task_id: tool-networkx-tool-v1

controls:
  positive: controls/tool-networkx-tool-v1/positive
  negatives:
    - path: controls/tool-networkx-tool-v1/negative_empty
      label: NC_empty
      must_fail_nodes: ["test_example"]
    - path: controls/tool-networkx-tool-v1/negative_hardcode
      label: NC_hardcode
      must_fail_nodes: ["test_held_example"]
    - path: controls/tool-networkx-tool-v1/negative_badexit
      label: NC_badexit
      must_fail_nodes: ["test_malformed_input_is_user_error"]
  # NC_reimpl(零 import 上游)不在此表:它在 oracle 上全绿,判死属
  # provenance 层(runner 验证阶段执法;harness 测试喂它自证查得出)。
  # 见 TOOL_READY_GATE §五。目录:controls/tool-networkx-tool-v1/negative_reimpl

requirements:
  - id: satisfy-user-examples
    owner: ADAPTER
    severity: HARD
    source_field: capability.statement
    public_text: >
      调用 pinned networkx 实现能力,使全部用户样例断言通过
      (行为以公开样例为准,例:networkx-tool inputs/mixed_components_unicode.graphml -> 见 expected/mixed_components_unicode.expected.txt; networkx-tool inputs/directed_parallel_edges.graphml -> 见 expected/directed_parallel_edges.expected.txt; networkx-tool inputs/empty_whitespace.graphml -> 见 expected/empty_whitespace.expected.txt)。
    examples:
      - "networkx-tool inputs/mixed_components_unicode.graphml -> 见 expected/mixed_components_unicode.expected.txt; networkx-tool inputs/directed_parallel_edges.graphml -> 见 expected/directed_parallel_edges.expected.txt; networkx-tool inputs/empty_whitespace.graphml -> 见 expected/empty_whitespace.expected.txt"
    oracle_nodes:
      - "test_capability::test_example_1"
      - "test_capability::test_example_2"
      - "test_capability::test_example_3"
      - "test_capability::test_held_example_1"
  - id: interface-contract
    owner: ADAPTER
    severity: HARD
    source_field: capability.statement
    public_text: >
      坏输入内容抛 UserInputError(骨架转 exit 1);不得让异常裸奔到
      兜底层(exit 2);重复调用同一输入输出逐字节一致;成功路径不向
      stderr 泄漏 traceback。
    examples:
      - "exit: 0=成功 1=用户错误 2=内部错误"
    oracle_nodes:
      - "test_capability::test_malformed_input_is_user_error"
      - "test_capability::test_deterministic_output"
      - "test_capability::test_stdout_purity_on_success"
  - id: skeleton-anchors-untouched
    owner: HOST_INPUT_GUARD
    severity: HARD
    source_field: capability.statement
    public_text: >
      骨架锚定件(main.py / bin/ / build.sh / tool.json / pyproject.toml)
      与其 argparse/输入存在检查/exit 语义由 harness 预置,不可修改,
      不计 agent 能力。
    examples:
      - "networkx-tool --help -> usage"
    oracle_nodes:
      - "test_interface_contract::test_help_reachable"
      - "test_interface_contract::test_missing_input_is_user_error"
  - id: intent-graph-size
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "摘要报告由 NetworkX 从输入 GraphML 读取的图的节点数和边数；两项分别等于该图的 number_of_nodes() 与 number_of_edges()。"
    examples: []
    verified_by: semantic-verifier:networkx-tool-semantic-v1
  - id: intent-component-groups
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "摘要列出图的全部分量及其完整节点成员：无向图使用连通分量，有向图使用弱连通分量。每个分量记录其成员数和成员节点；分量数等于所列记录数。"
    examples: []
    verified_by: semantic-verifier:networkx-tool-semantic-v1
  - id: intent-key-nodes
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "摘要报告最大无权度，并列出全部达到该最大值的节点。度采用 NetworkX Graph.degree() 的定义，因此有向图计入入度和出度，多重边按其次数计入；空图的最大度为 null，关键节点列表为空。"
    examples: []
    verified_by: semantic-verifier:networkx-tool-semantic-v1
  - id: intent-isolated-nodes
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "摘要列出 NetworkX isolates() 返回的全部孤立节点，即度为零的节点。"
    examples: []
    verified_by: semantic-verifier:networkx-tool-semantic-v1

