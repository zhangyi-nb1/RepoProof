tool:
  schema_version: 4
  name: xlsxwriter-tool
  summary: 一键把当月三四张财务 CSV 目录转成带汇总页与异常标红的离线审计 Excel 工作区。
  interface:
    usage: xlsxwriter-tool <input> --out-dir <new-directory>
    input:
      kind: directory
      format: 财务 CSV 目录（invoices.csv/payments.csv/accounts.csv）
      contract: null
    output:
      kind: directory
      format: workspace directory
      contract: null
    exit_codes:
      '0': success
      '1': user_error
      '2': internal_error
  delivery_profile_id: workspace_bundle_v1
  workspace_contract:
    schema_version: 1
    rules:
    - path_pattern: build_audit_workbook.py
      role: 生成审计工作簿的 Python 应用文件（由 build_workspace 写出）
      media_type: text/x-python
      validation_profile: python_compile_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: README.md
      role: 使用说明，指引通过 ./run.sh 运行
      media_type: text/markdown
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: sample_input/*.csv
      role: 随附的样例财务 CSV，可作为 ./run.sh 的默认输入
      media_type: text/csv
      validation_profile: csv_v1
      min_count: 3
      max_count: 4
      executable: false
    - path_pattern: output/audit_workbook.xlsx
      role: 生成的审计 Excel 工作簿
      media_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      validation_profile: xlsx_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: run.sh
      role: Harness-owned offline Python launcher
      media_type: text/x-shellscript
      validation_profile: shell_v1
      min_count: 1
      max_count: 1
      executable: true
    - path_pattern: requirements.lock.txt
      role: Frozen Python dependency lock
      media_type: text/plain
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: THIRD_PARTY_NOTICES.md
      role: Frozen third-party wheel inventory
      media_type: text/markdown
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: vendor/wheels/*.whl
      role: Frozen offline Python wheel closure
      media_type: application/zip
      validation_profile: wheel_v1
      min_count: 1
      max_count: 256
      executable: false
    allow_extra_files: false
    entrypoints:
    - run.sh
    runnable: true
    smoke_command:
    - ./run.sh
    smoke_timeout_seconds: 60
    require_offline_wheelhouse: true
    runtime_python_entrypoint: build_audit_workbook.py
    limits:
      max_files: 512
      max_total_bytes: 268435456
      max_file_bytes: 67108864
      max_depth: 4
      max_path_bytes: 200
    directory_profiles: []
capability:
  statement: '用户目标：每个月财务给我三四张 CSV（发票、付款、科目表），我想一键得到一个能直接交给审计的 Excel 工作簿，带汇总页和异常标红。

    公开行为承诺：

    - [sheets-present] 生成的 .xlsx 工作簿至少包含三个工作表：一个名为“汇总”的汇总页，以及分别名为“发票明细”和“付款明细”的明细页。

    - [invoice-detail-rows] “发票明细”工作表在表头行之后，为输入 invoices.csv 中的每一张发票各输出一行，且发票行的顺序与
    invoice_id 升序一致。

    - [paid-total-column] “发票明细”工作表为每张发票给出一列“已付合计”，其值等于 payments.csv 中 invoice_id
    匹配该发票的所有付款金额之和（无匹配付款时为 0）。

    - [amount-mismatch-flag] 当某发票的“已付合计”与该发票 amount 不相等时，该发票在“发票明细”中被标记为异常（异常状态列取“异常”），金额一致时取“正常”。

    - [unknown-account-flag] 当某发票的 account_code 未出现在 accounts.csv 的科目代码集合中时，该发票在“发票明细”中被标记为异常（异常状态列取“异常”）。

    - [anomaly-highlight-format] “发票明细”中每一条被判定为异常的发票行，其单元格套用了带红色字体颜色的单元格格式，用以视觉标红异常。

    - [summary-counts] “汇总”工作表给出发票总数、异常发票数、金额不符发票数与未知科目发票数四项统计，且数值与“发票明细”中的标记结果一致。

    公开产物协议：

    - [worksheet-names -> sheets-present] 定位：用 xlsxwriter 上游写出后，以标准 xlsx 解析读取工作簿的工作表名称列表。；值表示：字符串集合，至少包含“汇总”“发票明细”“付款明细”三项。

    - [invoice-rows -> invoice-detail-rows] 定位：“发票明细”工作表第 1 行为表头，自第 2 行起为数据行，按行读取
    invoice_id 列。；值表示：数据行序列；每行含 invoice_id 文本，行序为 invoice_id 升序。

    - [paid-total-cell -> paid-total-column] 定位：“发票明细”表头中名为“已付合计”的列，读取每个数据行对应单元格数值。；值表示：每行一个非负数值，等于匹配付款金额之和。

    - [status-cell -> amount-mismatch-flag,unknown-account-flag] 定位：“发票明细”表头中名为“异常状态”的列，读取每个数据行对应单元格文本。；值表示：枚举文本：“正常”或“异常”。

    - [anomaly-red-format -> anomaly-highlight-format] 定位：对“发票明细”中异常状态为“异常”的数据行单元格，读取其单元格格式的字体颜色属性。；值表示：字体颜色为红色的格式标记（如颜色值对应红色）。

    - [summary-metrics -> summary-counts] 定位：“汇总”工作表中以标签文本定位的四个统计单元格：发票总数、异常发票数、金额不符发票数、未知科目发票数。；值表示：四个非负整数，分别为对应计数，且与明细标记结果一致。

    统一运行语义：当输入不属于公开承诺定义的有效域时抛 UserInputError（CLI exit 1）；相同输入重复运行得到逐字节一致的结果；运行期完全离线。'
  output_schema: AuditWorkbookWorkspace
  intent_contract:
    schema_version: 1
    user_goal: 每个月财务给我三四张 CSV（发票、付款、科目表），我想一键得到一个能直接交给审计的 Excel 工作簿，带汇总页和异常标红。
    user_goal_sha256: 8fe194fd91bf6500b91c836ee2548b37298341f3b3801740573707ac6e60af12
    commitments:
    - commitment_id: sheets-present
      public_text: 生成的 .xlsx 工作簿至少包含三个工作表：一个名为“汇总”的汇总页，以及分别名为“发票明细”和“付款明细”的明细页。
      rationale: 用户要求带汇总页且能直接交给审计；工作表命名与存在性可由上游解析后核对。
      origin: MODEL_PROPOSED
    - commitment_id: invoice-detail-rows
      public_text: “发票明细”工作表在表头行之后，为输入 invoices.csv 中的每一张发票各输出一行，且发票行的顺序与 invoice_id
        升序一致。
      rationale: 审计需逐张发票核对；行数与顺序须与输入确定性对应。
      origin: MODEL_PROPOSED
    - commitment_id: paid-total-column
      public_text: “发票明细”工作表为每张发票给出一列“已付合计”，其值等于 payments.csv 中 invoice_id 匹配该发票的所有付款金额之和（无匹配付款时为
        0）。
      rationale: 金额是否收齐是审计核心，须由付款数据聚合驱动。
      origin: MODEL_PROPOSED
    - commitment_id: amount-mismatch-flag
      public_text: 当某发票的“已付合计”与该发票 amount 不相等时，该发票在“发票明细”中被标记为异常（异常状态列取“异常”），金额一致时取“正常”。
      rationale: 用户要求异常标红；金额不符是首要异常类别，需可判定。
      origin: MODEL_PROPOSED
    - commitment_id: unknown-account-flag
      public_text: 当某发票的 account_code 未出现在 accounts.csv 的科目代码集合中时，该发票在“发票明细”中被标记为异常（异常状态列取“异常”）。
      rationale: 科目代码不在科目表是第二类异常，须独立可判定。
      origin: MODEL_PROPOSED
    - commitment_id: anomaly-highlight-format
      public_text: “发票明细”中每一条被判定为异常的发票行，其单元格套用了带红色字体颜色的单元格格式，用以视觉标红异常。
      rationale: 用户明确要求“异常标红”，红色格式须实际写入工作簿并可从上游解析核验。
      origin: MODEL_PROPOSED
    - commitment_id: summary-counts
      public_text: “汇总”工作表给出发票总数、异常发票数、金额不符发票数与未知科目发票数四项统计，且数值与“发票明细”中的标记结果一致。
      rationale: 汇总页须准确概括明细页的异常计数，供审计快速总览。
      origin: MODEL_PROPOSED
    artifact_protocol:
