tool:
  schema_version: 4
  name: pygal-tool
  summary: 把导出的用量账单 CSV 变成一个 pygal 生成图表、可离线打开、按天/按模型看花费与余额并超阈值提醒的本地仪表盘工作区。
  interface:
    usage: pygal-tool <input> --out-dir <new-directory>
    input:
      kind: file
      format: 用量/账单 CSV
      contract: null
    output:
      kind: directory
      format: workspace directory
      contract: null
    exit_codes:
      '0': success
      '1': user_error
      '2': internal_error
  delivery_profile_id: workspace_bundle_v1
  workspace_contract:
    schema_version: 1
    rules:
    - path_pattern: dashboard_app.py
      role: 仪表盘生成应用（非可执行 Python 应用文件，由 build_workspace 写出）
      media_type: text/x-python
      validation_profile: python_compile_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: index.html
      role: 仪表盘主页面：嵌入图表、余额与超阈值提醒
      media_type: text/html
      validation_profile: html_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: charts/daily_cost.svg
      role: pygal 生成的按天总花费图表
      media_type: image/svg+xml
      validation_profile: svg_xml_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: charts/model_cost.svg
      role: pygal 生成的按模型花费图表
      media_type: image/svg+xml
      validation_profile: svg_xml_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: data/summary.csv
      role: 按天+按模型聚合花费明细表
      media_type: text/csv
      validation_profile: csv_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: README.md
      role: 使用说明（指示运行 ./run.sh）
      media_type: text/markdown
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: run.sh
      role: Harness-owned offline Python launcher
      media_type: text/x-shellscript
      validation_profile: shell_v1
      min_count: 1
      max_count: 1
      executable: true
    - path_pattern: requirements.lock.txt
      role: Frozen Python dependency lock
      media_type: text/plain
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: THIRD_PARTY_NOTICES.md
      role: Frozen third-party wheel inventory
      media_type: text/markdown
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: vendor/wheels/*.whl
      role: Frozen offline Python wheel closure
      media_type: application/zip
      validation_profile: wheel_v1
      min_count: 1
      max_count: 256
      executable: false
    allow_extra_files: false
    entrypoints:
    - run.sh
    runnable: true
    smoke_command:
    - ./run.sh
    smoke_timeout_seconds: 60
    require_offline_wheelhouse: true
    runtime_python_entrypoint: dashboard_app.py
    limits:
      max_files: 512
      max_total_bytes: 268435456
      max_file_bytes: 67108864
      max_depth: 12
      max_path_bytes: 240
capability:
  statement: '用户目标：我从 OpenAI 和 Anthropic 后台导出了几份用量/账单 CSV，想要一个本地就能打开、能按天按模型看花了多少、余额还剩多少、超阈值就提醒的仪表盘，以后每次导出新数据重跑一下就更新。

    公开行为承诺：

    - [daily-cost-aggregation] data/summary.csv 中按 (date, model) 聚合每条记录的 cost_usd
    合计，且各天全部模型花费之和等于该输入所有 cost_usd 之和。

    - [model-cost-aggregation] charts/model_cost.svg 由 pygal 生成，为每个出现过的模型给出一个跨全部日期的
    cost_usd 总花费数据点，模型集合与输入中出现的模型集合完全一致。

    - [daily-cost-chart] charts/daily_cost.svg 由 pygal 生成，横轴为升序排列的全部出现日期，每个日期的取值为该天所有模型
    cost_usd 之和。

    - [latest-balance] index.html 展示的当前余额取输入中最晚日期（并列时按 balance_usd 最小）对应的 balance_usd
    值。

    - [threshold-alert] 当任一 (date, model) 的 cost_usd 超过默认阈值（每条 10.0000 USD）时，index.html
    列出全部超阈值条目及其 date、model、cost_usd；无超阈值时明确显示无提醒。

    - [summary-columns] data/summary.csv 首行表头恰为 date,model,cost_usd,balance_usd 四列，数据行按
    date 升序、同日按 model 升序排列。

    公开产物协议：

    - [summary-table -> daily-cost-aggregation,summary-columns] 定位：data/summary.csv：以严格
    CSV 方言解析，首行为表头，随后为数据行。；值表示：表头恰为四列 date,model,cost_usd,balance_usd；每数据行 date 为
    YYYY-MM-DD，model 为字符串，cost_usd 与 balance_usd 为定点小数字符串；行按 (date 升序, model 升序) 排列。

    - [model-chart-points -> model-cost-aggregation] 定位：charts/model_cost.svg：作为 SVG/XML
    解析，读取 pygal 序列中每个数据点的标签与取值（含 desc/title 或 config 中的 x_labels 与序列值）。；值表示：每个模型对应一个数据点，标签为模型名，取值为该模型跨全部日期
    cost_usd 之和的数值；模型集合与输入模型集合相等，无重复。

    - [daily-chart-points -> daily-cost-chart] 定位：charts/daily_cost.svg：作为 SVG/XML
    解析，读取 pygal 的 x 轴标签序列与对应数据点取值。；值表示：x 轴标签为升序日期序列（YYYY-MM-DD），每个日期取值为该天全部模型 cost_usd
    之和的数值。

    - [balance-display -> latest-balance] 定位：index.html：解析 DOM，定位 id 为 current-balance
    的元素文本。；值表示：数值型余额字符串，等于输入中最晚日期（并列取 balance_usd 最小）对应的 balance_usd。

    - [alert-list -> threshold-alert] 定位：index.html：解析 DOM，定位 id 为 threshold-alerts
    的容器及其子条目。；值表示：每个子条目含 date、model、cost_usd 三项文本，对应一条 cost_usd>10.0000 的记录；若无记录则容器含单一无提醒文本。

    统一运行语义：当输入不属于公开承诺定义的有效域时抛 UserInputError（CLI exit 1）；相同输入重复运行得到逐字节一致的结果；运行期完全离线。'
  output_schema: UsageBillingDashboardWorkspace
  intent_contract:
    schema_version: 1
    user_goal: 我从 OpenAI 和 Anthropic 后台导出了几份用量/账单 CSV，想要一个本地就能打开、能按天按模型看花了多少、余额还剩多少、超阈值就提醒的仪表盘，以后每次导出新数据重跑一下就更新。
    user_goal_sha256: aec6f9bb4088ddc1dc0ed63a15de91d0128fcdc852adf919c408274d775850ba
    commitments:
    - commitment_id: daily-cost-aggregation
      public_text: data/summary.csv 中按 (date, model) 聚合每条记录的 cost_usd 合计，且各天全部模型花费之和等于该输入所有
        cost_usd 之和。
      rationale: 用户要求按天按模型看花了多少，聚合正确性是核心可见行为。
      origin: MODEL_PROPOSED
    - commitment_id: model-cost-aggregation
