        值。
      rationale: 用户要求看余额还剩多少，需要明确余额取值规则。
      origin: MODEL_PROPOSED
    - commitment_id: threshold-alert
      public_text: 当任一 (date, model) 的 cost_usd 超过默认阈值（每条 10.0000 USD）时，index.html
