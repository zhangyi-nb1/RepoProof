      rationale: 用户要求按模型查看花费；模型维度的完整性必须可核对。
      origin: MODEL_PROPOSED
    - commitment_id: daily-cost-chart
      public_text: charts/daily_cost.svg 由 pygal 生成，横轴为升序排列的全部出现日期，每个日期的取值为该天所有模型
        cost_usd 之和。
      rationale: 用户要求按天查看花费趋势，日期覆盖与顺序是可见约定。
      origin: MODEL_PROPOSED
    - commitment_id: latest-balance
