          或 config 中的 x_labels 与序列值）。
        value_encoding: 每个模型对应一个数据点，标签为模型名，取值为该模型跨全部日期 cost_usd 之和的数值；模型集合与输入模型集合相等，无重复。
      - observation_id: daily-chart-points
        commitment_ids:
        - daily-cost-chart
        locator: charts/daily_cost.svg：作为 SVG/XML 解析，读取 pygal 的 x 轴标签序列与对应数据点取值。
        value_encoding: x 轴标签为升序日期序列（YYYY-MM-DD），每个日期取值为该天全部模型 cost_usd 之和的数值。
      - observation_id: balance-display
        commitment_ids:
        - latest-balance
        locator: index.html：解析 DOM，定位 id 为 current-balance 的元素文本。
        value_encoding: 数值型余额字符串，等于输入中最晚日期（并列取 balance_usd 最小）对应的 balance_usd。
      - observation_id: alert-list
        commitment_ids:
        - threshold-alert
        locator: index.html：解析 DOM，定位 id 为 threshold-alerts 的容器及其子条目。
        value_encoding: 每个子条目含 date、model、cost_usd 三项文本，对应一条 cost_usd>10.0000 的记录；若无记录则容器含单一无提醒文本。
    delivery:
      profile_id: workspace_bundle_v1
      support_status: SUPPORTED
