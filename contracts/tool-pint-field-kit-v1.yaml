tool: {"schema_version": 3, "name": "pint-field-kit", "summary": "将实验耗材 TSV 按组数与目标单位换算为可离线打开、逐行保留成功和稳定错误状态的现场准备单。", "interface": {"usage": "pint-field-kit <input> [--out FILE]", "input": {"kind": "file", "format": "TSV 准备单", "contract": null}, "output": {"kind": "stdout", "format": "HTML", "contract": {"media_type": "text/html", "root_type": "text", "required": {}, "validation_profile": "safe_self_contained_xhtml_v1"}}, "exit_codes": {"0": "success", "1": "user_error", "2": "internal_error"}}}

capability:
  statement: "用户目标：把一份 TSV 准备单（item、per_group_amount、target_unit、groups）按每行组数算成现场可直接打开的离线网页；使用表里的目标单位换算，成功和失败都保留，换不了要说明，不要有联网资源、脚本或时间戳。\n公开行为承诺：\n- [table-columns] 输入是 UTF-8 TSV，表头必须依次为 item、per_group_amount、target_unit、groups，且每个数据行恰有四列。报告固定显示总行数、成功数和失败数，并包含一张明细表；明细表表头依次为 item、per_group_amount、groups、total_amount、status。\n- [row-preservation] TSV 的每个数据行都在明细表中生成且仅生成一行，保持输入顺序；行的 data-input-row 从 1 起连续编号，item、per_group_amount 和 groups 单元格逐字保留对应输入值。一行换算失败不得省略该行或阻止其他行进入报告。\n- [total-conversion] groups 必须仅由 ASCII 数字组成且十进制值大于零。工具使用固定版本 Pint 的 UnitRegistry 解析 per_group_amount，将其乘以 groups 后转换到该行非空的 target_unit。成功结果使用 Pint ~.6gP 格式，最多保留六位有效数字；不执行货币换算、外部单位查询或网络请求。\n- [successful-row] 成功行的 total_amount 是上述 Pint 转换和格式化得到的数量与单位，status 固定为 OK。报告中的成功数等于 status 为 OK 的明细行数，总行数等于输入数据行数。\n- [failed-row] 失败行的 total_amount 为空，status 只能是稳定错误码 INVALID_GROUPS、INVALID_QUANTITY、UNKNOWN_UNIT 或 DIMENSION_MISMATCH：groups 非 ASCII 正整数为 INVALID_GROUPS；数量或目标单位引用 Pint 未定义单位为 UNKNOWN_UNIT；已解析数量不能转换到目标量纲为 DIMENSION_MISMATCH；其他由该行数量语法、非有限数值、目标单位语法或数量运算引起的用户输入错误为 INVALID_QUANTITY。不得输出异常类名或异常文本；失败数等于这四种状态的行数。\n- [document-static] 交付物是确定性、自包含的 XHTML 文档，使用 XHTML 命名空间，固定包含 head、标题、汇总段落和明细表。只允许 html、head、meta、title、body、h1、p、table、thead、tbody、tr、th、td 元素，以及约定的 charset、id 和 data-input-row 属性；th 和 td 必须是无子元素的纯文本单元格。文档不含 DOCTYPE、实体、注释、额外处理指令、脚本、样式、链接、表单、外部资源、时间戳或生成时间，并对用户文本进行 XML 转义。\n公开产物协议：\n- [document-structure -> document-static] 定位：The XHTML root and its complete descendant element, attribute, text, tail, processing-instruction and comment structure.；值表示：An XML-parseable XHTML document in namespace http://www.w3.org/1999/xhtml with the exact static topology and attribute vocabulary defined by document-static.\n- [report-summary -> table-columns,successful-row,failed-row] 定位：XPath /*[local-name()='html']/*[local-name()='body']/*[local-name()='p' and @id='summary'].；值表示：Exact UTF-8 text 总行数：N；成功数：S；失败数：F, where N is the input data-row count, S is the number of OK rows, and F is the number of stable-error-code rows.\n- [table-header -> table-columns] 定位：XPath //*[local-name()='table' and @id='preparation-list']/*[local-name()='thead']/*[local-name()='tr']/*[local-name()='th'], in document order.；值表示：Exactly five leaf text cells: item, per_group_amount, groups, total_amount, status.\n- [input-rows -> row-preservation] 定位：XPath //*[local-name()='table' and @id='preparation-list']/*[local-name()='tbody']/*[local-name()='tr'], in document order.；值表示：Exactly one row per TSV data row; data-input-row is the consecutive ASCII integer starting at 1; every row contains exactly five leaf td cells.\n- [conversion-outcomes -> total-conversion,successful-row,failed-row] 定位：For every input-rows observation, inspect total_amount and status at zero-based cell positions 3 and 4.；值表示：OK rows contain the independently recomputed Pint ~.6gP result. Failure rows have an empty total_amount and exactly one of INVALID_GROUPS, INVALID_QUANTITY, UNKNOWN_UNIT, DIMENSION_MISMATCH.\n统一运行语义：当输入不属于公开承诺定义的有效域时抛 UserInputError（CLI exit 1）；相同输入重复运行得到逐字节一致的结果；运行期完全离线。"
  output_schema: "PintFieldKitXhtml"
