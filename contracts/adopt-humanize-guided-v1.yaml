task_id: adopt-humanize-guided-v1

source_repo:
  url: https://github.com/python-humanize/humanize
  revision: guided
  resolved_commit: ce4147b6c8f8a132f772be0929d58305eb22c5d9
  license: 存在但未识别类型
  distribution: humanize
  import_module: humanize

target_project:
  kind: consumer_fixture
  path: fixtures/assembled_humanize
  package: user_capability
  entry_point: run

requirement_spec_file: adopt-humanize-guided-v1.requirements.yaml

capability:
  statement: >
    为我的项目引入文件大小人性化显示能力:输入字节数(整数字符串),输出人类可读的大小文本(单位、小数位、单复数都要正确) 交付 /adaptation/adapter.py,暴露 run(value) 单函数,必须调用 pinned humanize 实现该能力;行为以公开样例为准(例:run('1') -> '1 Byte'; run('300') -> '300 Bytes'; run('999') -> '999 Bytes');重复调用确定;完全离线 CPU-only。公开样例与可运行公开测试位于 /consumer 下,是本合同的一部分。
  output_schema: UserExampleOutcome

environment: {os: linux, arch: arm64, python: "3.12", cpu_only: true, network_install: true, network_test: false}

constraints:
  forbidden: [gpu, privileged_container, oracle_write, model_download, network_at_test_time]
  editable_zones: [adaptation]
  forbidden_install_extras: []

budgets:
  max_agent_steps: 20
  max_wall_time_minutes: 30
  max_command_minutes: 5
  max_semantic_recoveries: 3
  max_same_action: 2
  max_patch_files: 8
  max_patch_lines: 400
  max_input_tokens_total: 400000
  max_output_tokens_total: 40000
  monetary_soft_cap_usd: 5.0

acceptance:
  capability_command: ["pytest", "-q", "/oracle/test_capability.py"]
  regression_command: ["pytest", "-q", "/oracle/test_regression.py"]
  probe_script: direct_frontmatter_probe_v2.py
