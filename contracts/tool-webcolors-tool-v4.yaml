task_id: tool-webcolors-tool-v4

source_repo:
  url: https://github.com/ubernostrum/webcolors
  revision: guided
  resolved_commit: e6392ba6eeba81b02e666eb3ed02ef2e006344c0
  license: BSD
  distribution: webcolors
  import_module: webcolors

target_project:
  kind: local_tool
  path: fixtures/tool_skeleton_webcolors-tool-v4
  package: webcolors_tool
  entry_point: webcolors-tool

requirement_spec_file: tool-webcolors-tool-v4.requirements.yaml
task_family: LOCAL-TOOL
adoption_shape: TOOL_ONBOARDING

tool: {"schema_version": 2, "name": "webcolors-tool", "summary": "将十六进制颜色转换为适配 MSP432 小车常规数字灰度模块接口的确定性明暗状态。", "interface": {"usage": "webcolors-tool <input> [--out FILE]", "input": {"kind": "file", "format": "JSON", "contract": null}, "output": {"kind": "stdout", "format": "JSON", "contract": {"media_type": "application/json", "root_type": "object", "required": {"source_hex": "string", "red": "integer", "green": "integer", "blue": "integer", "grayscale": "integer", "digital_level": "integer", "sensor_state": "string"}}}, "exit_codes": {"0": "success", "1": "user_error", "2": "internal_error"}}}

capability:
  statement: >
    输入必须是 UTF-8 JSON 对象，且只能包含字符串字段 color，例如 {"color":"#ff0000"}。工具使用 webcolors.hex_to_rgb 将上游支持的 CSS 十六进制颜色（#rgb 或 #rrggbb，大小写均可）解析为 0 至 255 的 RGB 分量；输出 source_hex 为小写、六位、带 # 的规范化颜色。灰度值按整数公式 grayscale=(299*red+587*green+114*blue+500)//1000 计算，范围为 0 至 255。为适配主动高电平的常规数字灰度模块逻辑接口，当 grayscale>=128 时输出 digital_level=1 且 sensor_state="LIGHT"；否则输出 digital_level=0 且 sensor_state="DARK"。该逻辑电平是统一的软件适配层定义；若实际模块为低电平有效，应由接线或下游硬件逻辑反相。字段采用紧凑 JSON 输出，重复运行结果确定一致，并且全过程完全离线。输入为空、非 JSON、不是对象、字段缺失或多余、color 不是字符串，或颜色不符合上游 webcolors 的十六进制颜色规则时，均抛出 UserInputError，并应由 CLI 以退出码 1 处理。 交付形态为标准工具包(TOOL_PACKAGE_LAYOUT):在骨架 src/webcolors_tool/impl.py 实现 extract(),必须调用 pinned webcolors;依赖锁进 requirements.lock.txt(replay 从它重建)。行为以公开样例为准(例:webcolors-tool inputs/typical_hex.json -> 见 expected/typical_hex.expected.txt; webcolors-tool inputs/shorthand_mixed_case.json -> 见 expected/shorthand_mixed_case.expected.txt; webcolors-tool inputs/valid_goldenrod.json -> 见 expected/valid_goldenrod.expected.txt);坏输入抛 UserInputError(→exit 1);重复调用确定;完全离线 CPU-only。骨架锚定件(main.py/bin/build.sh/tool.json/pyproject)不可改。公开样例与可运行公开测试位于骨架 public_tests/ 下,是本合同的一部分。
  output_schema: "Msp432GrayscaleState"

environment: {os: linux, arch: arm64, python: "3.12", cpu_only: true, network_install: true, network_test: false}

constraints:
  forbidden: [gpu, privileged_container, oracle_write, model_download, network_at_test_time]
  editable_zones: [tool]
  forbidden_install_extras: []

budgets:
  max_agent_steps: 20
  max_wall_time_minutes: 30
  max_command_minutes: 5
  max_semantic_recoveries: 3
  max_same_action: 2
  max_patch_files: 12
  max_patch_lines: 600
  max_input_tokens_total: 400000
  max_output_tokens_total: 40000
  monetary_soft_cap_usd: 5.0

acceptance:
  capability_command: ["pytest", "-q", "/oracle/test_capability.py"]
  regression_command: ["pytest", "-q", "public_tests/test_interface_contract.py"]
  probe_script: direct_tool_probe.py
