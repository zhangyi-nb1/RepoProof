        Extracted text 正文恰为对应 trafilatura.extract(raw_html, output_format="txt") 返回文本的
        strip() 结果。
      rationale: 保证每篇网页都有可直接阅读、可追溯到本地源文件的离线版本。
      origin: MODEL_PROPOSED
    - commitment_id: article-list-mapping
      public_text: article-list.csv 只包含可读网页，每行将源相对路径、生成的 articles/NNNN.md 路径和该提取正文的
        Python 字符数对应起来；行顺序与候选网页的相对路径排序一致。
      rationale: 提供可导入表格软件的文章清单及文件映射。
