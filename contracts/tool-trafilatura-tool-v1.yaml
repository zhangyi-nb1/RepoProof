        trafilatura.extract(raw_html, output_format="txt")，返回值经 strip() 后非空即为可读，否则为坏页。
      rationale: 明确网页批次的范围、排序和坏页判定，且不进行任何联网获取。
      origin: MODEL_PROPOSED
    - commitment_id: readable-article-files
