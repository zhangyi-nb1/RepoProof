task_id: adopt-inflection-guided-v2

source_repo:
  url: https://github.com/jpvanhal/inflection
  revision: guided
  resolved_commit: b00d4d348b32ef5823221b20ee4cbd1d2d924462
  license: 存在但未识别类型
  distribution: inflection
  import_module: inflection

target_project:
  kind: consumer_fixture
  path: fixtures/assembled_inflection-v2
  package: user_capability
  entry_point: run

requirement_spec_file: adopt-inflection-guided-v2.requirements.yaml

capability:
  statement: >
    为我的项目引入英文名词复数化能力:输入英文名词单数,输出正确的复数形式,不规则变化(如 person、child)也必须正确 交付 /adaptation/adapter.py,暴露 run(value) 单函数,必须调用 pinned inflection 实现该能力;行为以公开样例为准(例:run('person') -> 'people'; run('child') -> 'children'; run('analysis') -> 'analyses');重复调用确定;完全离线 CPU-only。公开样例与可运行公开测试位于 /consumer 下,是本合同的一部分。
  output_schema: UserExampleOutcome

environment: {os: linux, arch: arm64, python: "3.12", cpu_only: true, network_install: true, network_test: false}

constraints:
  forbidden: [gpu, privileged_container, oracle_write, model_download, network_at_test_time]
  editable_zones: [adaptation]
  forbidden_install_extras: []

budgets:
  max_agent_steps: 20
  max_wall_time_minutes: 30
  max_command_minutes: 5
  max_semantic_recoveries: 3
  max_same_action: 2
  max_patch_files: 8
  max_patch_lines: 400
  max_input_tokens_total: 400000
  max_output_tokens_total: 40000
  monetary_soft_cap_usd: 5.0

acceptance:
  capability_command: ["pytest", "-q", "/oracle/test_capability.py"]
  regression_command: ["pytest", "-q", "/oracle/test_regression.py"]
  probe_script: direct_frontmatter_probe_v2.py
