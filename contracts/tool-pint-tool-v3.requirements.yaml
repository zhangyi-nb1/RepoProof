task_id: tool-pint-tool-v3

controls:
  positive: controls/tool-pint-tool-v3/positive
  negatives:
    - path: controls/tool-pint-tool-v3/negative_empty
      label: NC_empty
      must_fail_nodes: ["test_example"]
    - path: controls/tool-pint-tool-v3/negative_hardcode
      label: NC_hardcode
      must_fail_nodes: ["test_held_example"]
    - path: controls/tool-pint-tool-v3/negative_badexit
      label: NC_badexit
      must_fail_nodes: ["test_malformed_input_is_user_error"]
  # NC_reimpl(零 import 上游)不在此表:它在 oracle 上全绿,判死属
  # provenance 层(runner 验证阶段执法;harness 测试喂它自证查得出)。
  # 见 TOOL_READY_GATE §五。目录:controls/tool-pint-tool-v3/negative_reimpl

requirements:
  - id: satisfy-user-examples
    owner: ADAPTER
    severity: HARD
    source_field: capability.statement
    public_text: >
      调用 pinned Pint 实现能力,使全部用户样例断言通过
      (行为以公开样例为准,例:pint-tool inputs/typical_nonascii.tsv -> 见 expected/typical_nonascii.expected.txt; pint-tool inputs/mixed_valid_unicode_and_pint_errors.tsv -> 见 expected/mixed_valid_unicode_and_pint_errors.expected.txt)。
    examples:
      - "pint-tool inputs/typical_nonascii.tsv -> 见 expected/typical_nonascii.expected.txt; pint-tool inputs/mixed_valid_unicode_and_pint_errors.tsv -> 见 expected/mixed_valid_unicode_and_pint_errors.expected.txt"
    oracle_nodes:
      - "test_capability::test_example_1"
      - "test_capability::test_example_2"
      - "test_capability::test_held_example_1"
  - id: interface-contract
    owner: ADAPTER
    severity: HARD
    source_field: capability.statement
    public_text: >
      坏输入内容抛 UserInputError(骨架转 exit 1);不得让异常裸奔到
      兜底层(exit 2);重复调用同一输入输出逐字节一致;成功路径不向
      stderr 泄漏 traceback。
    examples:
      - "exit: 0=成功 1=用户错误 2=内部错误"
    oracle_nodes:
      - "test_capability::test_malformed_input_is_user_error"
      - "test_capability::test_deterministic_output"
      - "test_capability::test_stdout_purity_on_success"
  - id: skeleton-anchors-untouched
    owner: HOST_INPUT_GUARD
    severity: HARD
    source_field: capability.statement
    public_text: >
      骨架锚定件(main.py / bin/ / build.sh / tool.json / pyproject.toml)
      与其 argparse/输入存在检查/exit 语义由 harness 预置,不可修改,
      不计 agent 能力。
    examples:
      - "pint-tool --help -> usage"
    oracle_nodes:
      - "test_interface_contract::test_help_reachable"
      - "test_interface_contract::test_missing_input_is_user_error"
  - id: intent-input-columns
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "输入必须是 UTF-8 TSV 表，表头且只能按此顺序为 sample_name、value、source_unit、target_unit，并至少有一条数据行。"
    examples: []
    verified_by: semantic-verifier:pint-tool-semantic-v1
  - id: intent-row-preservation
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "输出为可粘贴到 Excel 的 TSV，表头依次为 sample_name、value、source_unit、target_unit、converted_value、status、reason；每个有效输入数据行恰好对应一个输出数据行，并逐字保留前四列内容。"
    examples: []
    verified_by: semantic-verifier:pint-tool-semantic-v1
  - id: intent-pint-conversion
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "对可换算行，使用 Pint 0.25.3 以该行 value 和 source_unit 构造 Quantity 并转换到 target_unit；status 为 converted，converted_value 为该目标单位下的数值，reason 为空。"
    examples: []
    verified_by: semantic-verifier:pint-tool-semantic-v1
  - id: intent-compact-number-format
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "可换算行的 converted_value 使用 Python 的 .6g 格式化目标数量级，因此最多含 6 个有效数字，并会去除不必要的末尾小数位；极大或极小数值可使用科学计数法。"
    examples: []
    verified_by: semantic-verifier:pint-tool-semantic-v1
  - id: intent-unconvertible-row
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "当 Pint 在构造或转换该行 Quantity 时抛出 PintError（包括未知单位、量纲不兼容或偏移单位计算错误）时，该行不会被丢弃：status 为 unconverted，converted_value 为空，reason 精确写为“异常类名: Pint 异常消息”。"
    examples: []
    verified_by: semantic-verifier:pint-tool-semantic-v1
  - id: intent-finite-numeric-values
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "每行 value 必须能解析为有限的 Python 浮点数；NaN、Infinity 或非数值文本不构成有效换算表输入。"
    examples: []
    verified_by: semantic-verifier:pint-tool-semantic-v1

