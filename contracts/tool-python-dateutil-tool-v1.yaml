task_id: tool-python-dateutil-tool-v1

source_repo:
  url: https://github.com/dateutil/dateutil
  revision: guided
  resolved_commit: 1ae807774053c071acc9e7d3d27778fba0a7773e
  license: Apache-2.0
  distribution: python-dateutil
  import_module: dateutil

target_project:
  kind: local_tool
  path: fixtures/tool_skeleton_python-dateutil-tool
  package: python_dateutil_tool
  entry_point: python-dateutil-tool

requirement_spec_file: tool-python-dateutil-tool-v1.requirements.yaml
task_family: LOCAL-TOOL
adoption_shape: TOOL_ONBOARDING

tool: {"name": "python-dateutil-tool", "summary": "将每行一个的自由格式日期解析并规范化为 ISO 8601 输出。", "interface": {"usage": "python-dateutil-tool <input> [--out FILE]", "input": {"kind": "file", "format": "TXT"}, "output": {"kind": "stdout", "format": "TXT"}, "exit_codes": {"0": "success", "1": "user_error", "2": "internal_error"}}}

capability:
  statement: >
    使用 python-dateutil 的 dateutil.parser.parse 能力，将 UTF-8 文本文件中每一行的自由格式日期/日期时间解析为 ISO 8601 字符串。输入按行处理；每行首尾空白会被忽略，但空行视为错误；每个非空输入行必须完整表示一个可由 dateutil 解析的日期或日期时间，fuzzy=False，不接受未识别的附加文本。缺失字段使用固定默认值 1900-01-01 00:00:00 填充，以避免依赖当前日期；未指定时区的输入输出为无时区 ISO 8601，指定时区的输入保留解析得到的 UTC 偏移；不做联网查询、不做本地化推断、不转换到其他时区。输出与输入行一一对应，每行一个 datetime.isoformat() 结果，文件末尾包含单个换行。格式错误、无法解码、空文件或包含空行的输入都会抛出 UserInputError（CLI 应以 exit 1 退出）。重复运行在相同输入和相同依赖版本下是确定性的，并且完全离线。 交付形态为标准工具包(TOOL_PACKAGE_LAYOUT):在骨架 src/python_dateutil_tool/impl.py 实现 extract(),必须调用 pinned python-dateutil;依赖锁进 requirements.lock.txt(replay 从它重建)。行为以公开样例为准(例:python-dateutil-tool --help -> 'contains:usage'; python-dateutil-tool dates.txt -> 见 dates.expected.txt; python-dateutil-tool times.txt -> 'contains:2023-07-01T08:00:00+02:00');坏输入抛 UserInputError(→exit 1);重复调用确定;完全离线 CPU-only。骨架锚定件(main.py/bin/build.sh/tool.json/pyproject)不可改。公开样例与可运行公开测试位于骨架 public_tests/ 下,是本合同的一部分。
  output_schema: TXT

environment: {os: linux, arch: arm64, python: "3.12", cpu_only: true, network_install: true, network_test: false}

constraints:
  forbidden: [gpu, privileged_container, oracle_write, model_download, network_at_test_time]
  editable_zones: [tool]
  forbidden_install_extras: []

budgets:
  max_agent_steps: 20
  max_wall_time_minutes: 30
  max_command_minutes: 5
  max_semantic_recoveries: 3
  max_same_action: 2
  max_patch_files: 12
  max_patch_lines: 600
  max_input_tokens_total: 400000
  max_output_tokens_total: 40000
  monetary_soft_cap_usd: 5.0

acceptance:
  capability_command: ["pytest", "-q", "/oracle/test_capability.py"]
  regression_command: ["pytest", "-q", "public_tests/test_interface_contract.py"]
  probe_script: direct_tool_probe.py
