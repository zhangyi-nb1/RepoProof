tool:
  schema_version: 4
  name: pygal-tool
  summary: 把导出的 OpenAI/Anthropic 用量 CSV 生成一个本地离线的静态 HTML 仪表盘（按天按模型的花费、余额与超阈值提醒），每次重跑刷新。
  interface:
    usage: pygal-tool <input> --out-dir <new-directory>
    input:
      kind: file
      format: 用量/账单 CSV
      contract: null
    output:
      kind: directory
      format: workspace directory
      contract: null
    exit_codes:
      '0': success
      '1': user_error
      '2': internal_error
  delivery_profile_id: workspace_bundle_v1
  workspace_contract:
    schema_version: 1
    rules:
    - path_pattern: dashboard.py
      role: dashboard generator application (writes the HTML/SVG from the input CSV)
      media_type: text/x-python
      validation_profile: python_compile_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: index.html
      role: dashboard landing page linking daily and per-model views
      media_type: text/html
      validation_profile: html_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: daily.html
      role: daily spend view embedding the daily bar chart
      media_type: text/html
      validation_profile: html_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: by_model.html
      role: per-model spend view embedding the per-model chart
      media_type: text/html
      validation_profile: html_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: charts/daily_spend.svg
      role: pygal-rendered daily spend chart
      media_type: image/svg+xml
      validation_profile: svg_xml_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: charts/model_spend.svg
      role: pygal-rendered per-model spend chart
      media_type: image/svg+xml
      validation_profile: svg_xml_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: README.md
      role: usage instructions
      media_type: text/markdown
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: run.sh
      role: Harness-owned offline Python launcher
      media_type: text/x-shellscript
      validation_profile: shell_v1
      min_count: 1
      max_count: 1
      executable: true
    - path_pattern: requirements.lock.txt
      role: Frozen Python dependency lock
      media_type: text/plain
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: THIRD_PARTY_NOTICES.md
      role: Frozen third-party wheel inventory
      media_type: text/markdown
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: vendor/wheels/*.whl
      role: Frozen offline Python wheel closure
      media_type: application/zip
      validation_profile: wheel_v1
      min_count: 1
      max_count: 256
      executable: false
    allow_extra_files: false
    entrypoints:
    - run.sh
    runnable: true
    smoke_command:
    - ./run.sh
    smoke_timeout_seconds: 60
    require_offline_wheelhouse: true
    runtime_python_entrypoint: dashboard.py
    limits:
      max_files: 512
      max_total_bytes: 268435456
      max_file_bytes: 67108864
      max_depth: 12
      max_path_bytes: 240
    directory_profiles:
    - static_site_v1
capability:
  statement: '用户目标：我从 OpenAI 和 Anthropic 后台导出了几份用量/账单 CSV，想要一个本地就能打开、能按天按模型看花了多少、余额还剩多少、超阈值就提醒的仪表盘，以后每次导出新数据重跑一下就更新。

    公开行为承诺：

    - [daily-spend-totals] daily.html 展示每个出现日期的总花费（同一日期所有模型 cost_usd 求和），日期按升序排列，且
    charts/daily_spend.svg 由 pygal 渲染，其数据点值集合与这些每日总额一致。

    - [per-model-spend-totals] by_model.html 展示每个出现模型的总花费（该模型所有行 cost_usd 求和），模型名按升序排列，且
    charts/model_spend.svg 由 pygal 渲染，其数据点值集合与这些每模型总额一致。

    - [remaining-balance] 当输入含 balance_usd 列时，index.html 展示按日期升序取最后一天的余额作为“当前剩余余额”；无该列时展示“余额未知”。

    - [threshold-alerts] 当某一天的总花费严格大于该天记录的 threshold_usd 时，index.html 在“超阈值提醒”区列出该日期及其总花费；无
    threshold_usd 列或无任何一天超阈值时该区显示“无超阈值日期”。

    公开产物协议：

    - [daily-rows -> daily-spend-totals] 定位：在 daily.html 中定位 id="daily-spend" 的 <table>，读取每个数据
    <tr>：第一个 <td> 为日期(YYYY-MM-DD)，第二个 <td> 为该日总花费；行按日期升序出现。；值表示：HTML 表格，每行两列：ISO 日期字符串；十进制美元金额（保留两位小数，无货币符号）。

    - [daily-chart-values -> daily-spend-totals] 定位：解析 charts/daily_spend.svg（SVG
    XML），读取 pygal 数据点节点上的 title/value，收集其数值集合。；值表示：SVG XML；数值为十进制金额，集合应等于 daily.html
    每日总额集合。

    - [model-rows -> per-model-spend-totals] 定位：在 by_model.html 中定位 id="model-spend"
    的 <table>，读取每个数据 <tr>：第一个 <td> 为模型名，第二个 <td> 为该模型总花费；行按模型名升序出现。；值表示：HTML 表格，每行两列：模型名字符串；十进制美元金额（两位小数）。

    - [model-chart-values -> per-model-spend-totals] 定位：解析 charts/model_spend.svg（SVG
    XML），读取 pygal 数据点节点上的 title/value，收集其数值集合。；值表示：SVG XML；数值为十进制金额，集合应等于 by_model.html
    每模型总额集合。

    - [balance-value -> remaining-balance] 定位：在 index.html 中定位 id="remaining-balance"
    的元素，读取其文本内容。；值表示：十进制美元金额（两位小数）字符串，或字面文本“余额未知”。

    - [threshold-alert-list -> threshold-alerts] 定位：在 index.html 中定位 id="threshold-alerts"
    的容器，读取其内每个 <li> 的文本（日期与总花费），或其占位文本。；值表示：每个 <li>：ISO 日期 + 十进制金额；无超阈值时容器文本为字面“无超阈值日期”。

    统一运行语义：当输入不属于公开承诺定义的有效域时抛 UserInputError（CLI exit 1）；相同输入重复运行得到逐字节一致的结果；运行期完全离线。'
