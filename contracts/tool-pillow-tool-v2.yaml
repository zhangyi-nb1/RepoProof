tool:
  schema_version: 4
  name: pillow-tool
  summary: 将实验照片文件夹转换为含缩略图、总览拼图、拍摄信息表和离线索引页的本地工作区。
  interface:
    usage: pillow-tool <input> --out-dir <new-directory>
    input:
      kind: directory
      format: 本地实验照片文件夹
      contract: null
    output:
      kind: directory
      format: workspace directory
      contract: null
    exit_codes:
      '0': success
      '1': user_error
      '2': internal_error
  delivery_profile_id: workspace_bundle_v1
  workspace_contract:
    schema_version: 1
    rules:
    - path_pattern: index.html
      role: 离线照片索引页
      media_type: text/html
      validation_profile: html_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: overview.png
      role: 照片总览拼图
      media_type: image/png
      validation_profile: png_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: image-metadata.csv
      role: 照片尺寸与拍摄信息表
      media_type: text/csv
      validation_profile: csv_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: image_indexer.py
      role: 离线工作区说明应用
      media_type: text/x-python
      validation_profile: python_compile_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: thumbnails/*.png
      role: 每张照片的 PNG 缩略图
      media_type: image/png
      validation_profile: png_v1
      min_count: 1
      max_count: 400
      executable: false
    - path_pattern: run.sh
      role: Harness-owned offline Python launcher
      media_type: text/x-shellscript
      validation_profile: shell_v1
      min_count: 1
      max_count: 1
      executable: true
    - path_pattern: requirements.lock.txt
      role: Frozen Python dependency lock
      media_type: text/plain
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: THIRD_PARTY_NOTICES.md
      role: Frozen third-party wheel inventory
      media_type: text/markdown
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: vendor/wheels/*.whl
      role: Frozen offline Python wheel closure
      media_type: application/zip
      validation_profile: wheel_v1
      min_count: 1
      max_count: 256
      executable: false
    allow_extra_files: false
    entrypoints:
    - run.sh
    runnable: true
    smoke_command:
    - ./run.sh
    smoke_timeout_seconds: 20
    require_offline_wheelhouse: true
    runtime_python_entrypoint: image_indexer.py
    limits:
      max_files: 512
      max_total_bytes: 268435456
      max_file_bytes: 67108864
      max_depth: 12
      max_path_bytes: 240
capability:
  statement: '用户目标：一个文件夹里几百张实验照片，我想要缩略图、一张总览拼图、每张图的尺寸和拍摄信息表，还要一个能离线翻看的索引页。

    公开行为承诺：

    - [image-discovery] 工具递归扫描输入文件夹中扩展名为 .bmp、.gif、.jpeg、.jpg、.png、.tif、.tiff 或 .webp
    的常规文件，并按其 POSIX 相对路径的 Unicode 码点顺序为每张照片生成一条记录。

    - [dimension-metadata] 每条照片记录的 width_px 和 height_px 分别等于 Pillow 打开该原图后 Image.size
    返回的宽度和高度。

    - [capture-metadata] 每条照片记录输出 captured_at、make 和 model：captured_at 优先取 EXIF DateTimeOriginal（36867），缺失时取
    DateTime（306）；make 取 Make（271），model 取 Model（272）；缺失值为空字符串。

    - [thumbnail-rendering] 工具为每张照片生成一个 PNG 缩略图；缩略图由 Pillow 的 LANCZOS 缩放生成，保持原始长宽比，宽度不超过
    240 像素且高度不超过 180 像素。

    - [overview-collage] 工具生成 overview.png 总览拼图：画布宽 1280 像素、高为 216×ceil(照片数/5) 像素，白色背景；照片顺序的缩略图按五列排列，每格
    256×216 像素并从格内坐标 (8,8) 放置。

    - [offline-index-page] 工具生成 index.html，其中 image-table 的每一行对应 image-metadata.csv
    中同顺序的一张照片，显示其缩略图、源路径、尺寸、拍摄时间、厂商和型号；页面只引用工作区内的相对本地 overview.png、image-metadata.csv
    和缩略图资源。

    公开产物协议：

    - [image-row-order -> image-discovery] 定位：Parse image-metadata.csv as UTF-8 CSV;
    read all data rows in their serialized order and the source_path column.；值表示：The
    header is exactly image_id,source_path,width_px,height_px,captured_at,make,model,thumbnail_file.
    source_path values are POSIX relative paths and rows are ordered by Unicode code-point
    ordering of source_path.

    - [dimension-columns -> dimension-metadata] 定位：For each data row in image-metadata.csv,
    read source_path, width_px, and height_px.；值表示：width_px and height_px are base-10
    positive integers representing the two members of Pillow Image.size for the source
    image named by source_path.

    - [capture-columns -> capture-metadata] 定位：For each data row in image-metadata.csv,
    read captured_at, make, and model.；值表示：captured_at, make, and model are UTF-8
    text. captured_at is the string form of EXIF tag 36867 when present, otherwise
    the string form of tag 306 when present, otherwise an empty string. make and model
    are respectively the string forms of EXIF tags 271 and 272, or empty strings when
    absent.

    - [thumbnail-files -> thumbnail-rendering] 定位：For each row in image-metadata.csv,
    open the PNG at the relative path stored in thumbnail_file.；值表示：thumbnail_file
    is a relative path with the syntax thumbnails/<64-lowercase-hexadecimal-image-id>.png.
    Each referenced file is a PNG whose width is at most 240 pixels and whose height
    is at most 180 pixels.

    - [overview-layout -> overview-collage] 定位：Open overview.png and compare it with
    the thumbnail files named by image-metadata.csv in row order.；值表示：overview.png
    is an RGBA PNG with width 1280 and height 216*ceil(row_count/5). It has opaque
    white background and places each row-order thumbnail at the top-left coordinate
    (8 + 256*(row_index mod 5), 8 + 216*floor(row_index/5)).

    - [index-table -> offline-index-page] 定位：Parse index.html; locate table#image-table
    and its tbody tr elements, then inspect each row''s data-image-id attribute and
    descendant img src attribute.；值表示：There is one tbody row per image-metadata.csv
    data row, in the same order. Every row has data-image-id equal to the row image_id
    and contains an img whose src equals that row thumbnail_file. The document contains
    only relative local references for overview.png, image-metadata.csv, and thumbnail
    files.

    统一运行语义：当输入不属于公开承诺定义的有效域时抛 UserInputError（CLI exit 1）；相同输入重复运行得到逐字节一致的结果；运行期完全离线。'
  output_schema: WorkspacePhotoIndexBundle
