tool:
  schema_version: 4
  name: python-pptx-tool
  summary: 把季度指标与要点笔记 JSON 打包成离线工作区，运行后生成可汇报的 PowerPoint 幻灯片与逐页讲稿文本。
  interface:
    usage: python-pptx-tool <input> --out-dir <new-directory>
    input:
      kind: file
      format: 季度指标与要点笔记 JSON
      contract: null
    output:
      kind: directory
      format: workspace directory
      contract: null
    exit_codes:
      '0': success
      '1': user_error
      '2': internal_error
  delivery_profile_id: workspace_bundle_v1
  workspace_contract:
    schema_version: 1
    rules:
    - path_pattern: generate_deck.py
      role: 生成幻灯片与讲稿的 Python 应用文件（由 build_workspace 写出）
      media_type: text/x-python
      validation_profile: python_compile_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: README.md
      role: 使用说明，指引运行 ./run.sh
      media_type: text/markdown
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: metrics.json
      role: 示例/内置输入 JSON，供 ./run.sh 无参数冒烟运行
      media_type: application/json
      validation_profile: json_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: out/quarterly_deck.pptx
      role: 生成的 PowerPoint 演示文稿
      media_type: application/vnd.openxmlformats-officedocument.presentationml.presentation
      validation_profile: pptx_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: out/speaker_notes.txt
      role: 生成的讲稿文本
      media_type: text/plain
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: run.sh
      role: Harness-owned offline Python launcher
      media_type: text/x-shellscript
      validation_profile: shell_v1
      min_count: 1
      max_count: 1
      executable: true
    - path_pattern: requirements.lock.txt
      role: Frozen Python dependency lock
      media_type: text/plain
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: THIRD_PARTY_NOTICES.md
      role: Frozen third-party wheel inventory
      media_type: text/markdown
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: vendor/wheels/*.whl
      role: Frozen offline Python wheel closure
      media_type: application/zip
      validation_profile: wheel_v1
      min_count: 1
      max_count: 256
      executable: false
    allow_extra_files: false
    entrypoints:
    - run.sh
    runnable: true
    smoke_command:
    - ./run.sh
    smoke_timeout_seconds: 60
    require_offline_wheelhouse: true
    runtime_python_entrypoint: generate_deck.py
    limits:
      max_files: 512
      max_total_bytes: 268435456
      max_file_bytes: 67108864
      max_depth: 6
      max_path_bytes: 240
    directory_profiles: []
capability:
  statement: '用户目标：我有季度指标的 JSON 和一份要点笔记，想生成一套能直接汇报的幻灯片，再附一份讲稿。

    公开行为承诺：

    - [title-slide] 生成的 .pptx 第一张幻灯片为标题幻灯片，其标题文本等于输入 JSON 的 title 字段，副标题文本等于 subtitle
    字段（subtitle 为空字符串时副标题占位符文本为空）。

    - [one-content-slide-per-entry] 标题幻灯片之后，每个 slides[] 条目按输入数组顺序恰好生成一张内容幻灯片，内容幻灯片总数等于
    slides 数组长度；每张内容幻灯片的标题文本等于对应条目的 heading 字段。

    - [metrics-rendered-on-slide] 每张内容幻灯片的正文按对应条目 metrics[] 的顺序逐条列出指标，每条呈现为“name:
    value unit”（unit 为空字符串时省略末尾空格与单位），无 metrics 时正文不含指标行。

    - [notes-on-slide] 每张内容幻灯片的备注（notes_slide 的 notes 文本框）文本等于对应条目的 notes 字段；notes
    为空字符串时备注文本为空。

    - [speaker-notes-file-order] out/speaker_notes.txt 按内容幻灯片顺序逐页给出讲稿，每页以其 heading
    作为该段标题并包含该页 notes 文本，页与页之间可区分且顺序与幻灯片一致。

    公开产物协议：

    - [title-slide-text -> title-slide] 定位：用 pptx.Presentation 打开 out/quarterly_deck.pptx，取
    slides[0]（第一张幻灯片）的标题占位符与副标题占位符的 text。；值表示：两个 UTF-8 字符串：标题占位符文本与副标题占位符文本。

    - [content-slide-count-and-headings -> one-content-slide-per-entry] 定位：用 pptx.Presentation
    打开 out/quarterly_deck.pptx，取 slides[1:] 的数量，以及每张幻灯片标题占位符的 text，按幻灯片顺序排列。；值表示：一个整数（内容幻灯片数量）后接按顺序排列的
    UTF-8 标题字符串列表。

    - [content-slide-metric-lines -> metrics-rendered-on-slide] 定位：对每张内容幻灯片（slides[1:]），读取其正文文本框中按段落顺序排列的指标行文本。；值表示：每张内容幻灯片对应一个有序的
    UTF-8 行字符串列表，每行形如 name: value 或 name: value unit。

    - [content-slide-notes-text -> notes-on-slide] 定位：对每张内容幻灯片（slides[1:]），若 has_notes_slide
    则读取 notes_slide.notes_text_frame.text，否则视为空字符串，按幻灯片顺序排列。；值表示：按内容幻灯片顺序排列的 UTF-8
    备注字符串列表。

    - [speaker-notes-per-page -> speaker-notes-file-order] 定位：以 UTF-8 读取 out/speaker_notes.txt
    全文，按页分段解析：每段以该页 heading 起始并含其 notes 文本，段落顺序即内容幻灯片顺序。；值表示：按顺序排列的分段文本，每段包含一个 heading
    字符串与其 notes 字符串。

    统一运行语义：当输入不属于公开承诺定义的有效域时抛 UserInputError（CLI exit 1）；相同输入重复运行得到逐字节一致的结果；运行期完全离线。'
  output_schema: QuarterlyDeckWorkspace
  intent_contract:
