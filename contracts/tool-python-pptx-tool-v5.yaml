        为空字符串时省略末尾空格与单位），无 metrics 时正文不含指标行。'
      rationale: 用户提供的季度指标名称/数值/单位须在幻灯片上可见。
      origin: MODEL_PROPOSED
    - commitment_id: notes-on-slide
