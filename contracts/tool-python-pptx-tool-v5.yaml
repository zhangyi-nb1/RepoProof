        字段（subtitle 为空字符串时副标题占位符文本为空）。
      rationale: 用户要求可直接汇报的幻灯片，标题页须忠实反映输入标题与副标题。
      origin: MODEL_PROPOSED
    - commitment_id: one-content-slide-per-entry
