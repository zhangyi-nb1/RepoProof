task_id: tool-phonenumbers-tool-v1

source_repo:
  url: https://github.com/daviddrysdale/python-phonenumbers
  revision: guided
  resolved_commit: e605afeba7572cfe1821f1015f29b24f1d7602b5
  license: Apache-2.0
  distribution: phonenumbers
  import_module: phonenumbers

target_project:
  kind: local_tool
  path: fixtures/tool_skeleton_phonenumbers-tool
  package: phonenumbers_tool
  entry_point: phonenumbers-tool

requirement_spec_file: tool-phonenumbers-tool-v1.requirements.yaml
task_family: LOCAL-TOOL
adoption_shape: TOOL_ONBOARDING

tool: {"name": "phonenumbers-tool", "summary": "把纯文本中每行一个的国际电话号码离线、确定性地规范为 E.164 格式。", "interface": {"usage": "tool-tool <input> [--out FILE]", "input": {"kind": "file", "format": "TXT"}, "output": {"kind": "stdout", "format": "TXT"}, "exit_codes": {"0": "success", "1": "user_error", "2": "internal_error"}}}

capability:
  statement: >
    读取 UTF-8/UTF-8-SIG 纯文本文件，输入必须是每行一个电话号码。每行会先去除首尾空白；空行视为格式错误。每个号码必须包含明确的国际区号，通常以 “+” 开头，以避免依赖默认国家/地区。工具使用上游 phonenumbers 库解析并校验号码；只有 phonenumbers 判定为有效的号码才会输出。输出保持输入顺序和重复项，每个有效号码渲染为标准 E.164 形式（例如 +14155552671），每行一个，文件末尾包含单个换行符。不会进行联网、不会查询外部服务、不会根据本机区域设置改变结果。畸形输入、无法解码输入、空文件、全空白文件或任意一行无法解析/无效时均抛出 UserInputError（CLI 退出码 1），且不产生部分成功语义。重复运行结果确定性一致，完全离线。 交付形态为标准工具包(TOOL_PACKAGE_LAYOUT):在骨架 src/phonenumbers_tool/impl.py 实现 extract(),必须调用 pinned phonenumbers;依赖锁进 requirements.lock.txt(replay 从它重建)。行为以公开样例为准(例:phonenumbers-tool inputs/us.txt -> 见 expected/us.txt; phonenumbers-tool inputs/cn.txt -> 见 expected/cn.txt);坏输入抛 UserInputError(→exit 1);重复调用确定;完全离线 CPU-only。骨架锚定件(main.py/bin/build.sh/tool.json/pyproject)不可改。公开样例与可运行公开测试位于骨架 public_tests/ 下,是本合同的一部分。
  output_schema: TXT

environment: {os: linux, arch: arm64, python: "3.12", cpu_only: true, network_install: true, network_test: false}

constraints:
  forbidden: [gpu, privileged_container, oracle_write, model_download, network_at_test_time]
  editable_zones: [tool]
  forbidden_install_extras: []

budgets:
  max_agent_steps: 20
  max_wall_time_minutes: 30
  max_command_minutes: 5
  max_semantic_recoveries: 3
  max_same_action: 2
  max_patch_files: 12
  max_patch_lines: 600
  max_input_tokens_total: 400000
  max_output_tokens_total: 40000
  monetary_soft_cap_usd: 5.0

acceptance:
  capability_command: ["pytest", "-q", "/oracle/test_capability.py"]
  regression_command: ["pytest", "-q", "public_tests/test_interface_contract.py"]
  probe_script: direct_tool_probe.py
