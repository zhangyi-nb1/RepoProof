task_id: tool-pygal-tool-v2
controls:
  positive: controls/tool-pygal-tool-v2/positive
  negatives:
  - path: controls/tool-pygal-tool-v2/negative_empty
    label: NC_empty
    must_fail_nodes:
    - test_example
  - path: controls/tool-pygal-tool-v2/negative_hardcode
    label: NC_hardcode
    must_fail_nodes:
    - test_held_example
requirements:
- id: workspace-examples
  owner: ADAPTER
  severity: HARD
  source_field: capability.statement
  public_text: Generate the user-confirmed workspace for every admitted input.
  examples:
  - two-providers-mixed
  - single-day-single-model
  oracle_nodes:
  - test_capability::test_example_1
  - test_capability::test_example_2
  - test_capability::test_held_example_1
- id: workspace-interface
  owner: HOST_INPUT_GUARD
  severity: HARD
  source_field: tool.interface
  public_text: Accept one local path and atomically create only a new --out-dir.
  examples:
  - pygal-tool <input> --out-dir <new-directory>
  oracle_nodes:
  - test_interface_contract::test_help_reachable
  - test_interface_contract::test_missing_input_is_user_error
  - test_interface_contract::test_existing_output_is_not_overwritten
- id: workspace-structure
  owner: HARNESS
  severity: HARD
  source_field: tool.workspace_contract
  public_text: Every output must satisfy the confirmed directory structure and format
    contract.
  examples: []
  oracle_nodes: []
  verified_by: workspace-structure-validator-v1
- id: intent-spend-by-day-chart
  owner: ADAPTER
  severity: HARD
  source_field: capability.intent_contract.commitments
  public_text: charts/spend_by_day.svg 是由 pygal 渲染的柱状图，其 x 轴标签为输入中出现的每个不同日期（按日期升序去重），每个日期对应的柱值等于该日全部记录
    cost 之和（保留两位小数）。
  examples: []
  oracle_nodes: []
  verified_by: semantic-verifier:pygal-tool-workspace-semantic-v1
- id: intent-spend-by-model-chart
  owner: ADAPTER
  severity: HARD
  source_field: capability.intent_contract.commitments
  public_text: charts/spend_by_model.svg 是由 pygal 渲染的柱状图，其 x 轴标签为输入中出现的每个不同模型名（按名称升序去重），每个模型对应的柱值等于该模型全部记录
    cost 之和（保留两位小数）。
  examples: []
  oracle_nodes: []
  verified_by: semantic-verifier:pygal-tool-workspace-semantic-v1
- id: intent-summary-rows
  owner: ADAPTER
  severity: HARD
  source_field: capability.intent_contract.commitments
  public_text: summary.csv 表头为 scope,key,total_cost,alert；先输出所有 scope=day 的行（key 为日期，按日期升序），再输出所有
    scope=model 的行（key 为模型，按模型名升序）；total_cost 为对应聚合花费保留两位小数。
  examples: []
  oracle_nodes: []
  verified_by: semantic-verifier:pygal-tool-workspace-semantic-v1
- id: intent-threshold-alert
  owner: ADAPTER
  severity: HARD
  source_field: capability.intent_contract.commitments
  public_text: 当输入含 threshold 列时，summary.csv 中每个 scope=day 行的 alert 值在该日 total_cost
    严格大于该日 threshold 时为 OVER，否则为 OK；无 threshold 列时所有 alert 为 NA。scope=model 行的 alert
    恒为 NA。
  examples: []
  oracle_nodes: []
  verified_by: semantic-verifier:pygal-tool-workspace-semantic-v1
- id: intent-balance-latest
  owner: ADAPTER
  severity: HARD
  source_field: capability.intent_contract.commitments
  public_text: 当输入含 balance 列时，index.html 中标记为 id="latest-balance" 的元素文本等于输入中最新日期（按日期升序取最后一个）任一记录的
    balance 值；无 balance 列时该元素文本为 NA。
  examples: []
  oracle_nodes: []
  verified_by: semantic-verifier:pygal-tool-workspace-semantic-v1
