task_id: tool-rispy-tool-v2

controls:
  positive: controls/tool-rispy-tool-v2/positive
  negatives:
    - path: controls/tool-rispy-tool-v2/negative_empty
      label: NC_empty
      must_fail_nodes: ["test_example"]
    - path: controls/tool-rispy-tool-v2/negative_hardcode
      label: NC_hardcode
      must_fail_nodes: ["test_held_example"]
    - path: controls/tool-rispy-tool-v2/negative_badexit
      label: NC_badexit
      must_fail_nodes: ["test_malformed_input_is_user_error"]
  # NC_reimpl(零 import 上游)不在此表:它在 oracle 上全绿,判死属
  # provenance 层(runner 验证阶段执法;harness 测试喂它自证查得出)。
  # 见 TOOL_READY_GATE §五。目录:controls/tool-rispy-tool-v2/negative_reimpl

requirements:
  - id: satisfy-user-examples
    owner: ADAPTER
    severity: HARD
    source_field: capability.statement
    public_text: >
      调用 pinned rispy 实现能力,使全部用户样例断言通过
      (行为以公开样例为准,例:rispy-tool inputs/chinese_exact_duplicate.ris -> 见 expected/chinese_exact_duplicate.expected.txt; rispy-tool inputs/chinese_exact_duplicate_and_distinct -> 见 expected/chinese_exact_duplicate_and_distinct.expected.txt)。
    examples:
      - "rispy-tool inputs/chinese_exact_duplicate.ris -> 见 expected/chinese_exact_duplicate.expected.txt; rispy-tool inputs/chinese_exact_duplicate_and_distinct -> 见 expected/chinese_exact_duplicate_and_distinct.expected.txt"
    oracle_nodes:
      - "test_capability::test_example_1"
      - "test_capability::test_example_2"
      - "test_capability::test_held_example_1"
  - id: interface-contract
    owner: ADAPTER
    severity: HARD
    source_field: capability.statement
    public_text: >
      坏输入内容抛 UserInputError(骨架转 exit 1);不得让异常裸奔到
      兜底层(exit 2);重复调用同一输入输出逐字节一致;成功路径不向
      stderr 泄漏 traceback。
    examples:
      - "exit: 0=成功 1=用户错误 2=内部错误"
    oracle_nodes:
      - "test_capability::test_malformed_input_is_user_error"
      - "test_capability::test_deterministic_output"
      - "test_capability::test_stdout_purity_on_success"
  - id: skeleton-anchors-untouched
    owner: HOST_INPUT_GUARD
    severity: HARD
    source_field: capability.statement
    public_text: >
      骨架锚定件(main.py / bin/ / build.sh / tool.json / pyproject.toml)
      与其 argparse/输入存在检查/exit 语义由 harness 预置,不可修改,
      不计 agent 能力。
    examples:
      - "rispy-tool --help -> usage"
    oracle_nodes:
      - "test_interface_contract::test_help_reachable"
      - "test_interface_contract::test_missing_input_is_user_error"
  - id: intent-ris-upstream-parse-and-write
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "对于有效的 UTF-8 RIS 输入，输出必须严格等于：先由固定版本 rispy 的 `loads` 解析输入，再按本工具的去重规则筛选记录，最后由同一 rispy 的 `dumps` 序列化筛选结果所得到的 RIS 文本。"
    examples: []
    verified_by: semantic-verifier:rispy-tool-semantic-v1
  - id: intent-parsed-record-exact-deduplication
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "按输入顺序处理 rispy 解析出的记录；若某条记录与任一较早已保留记录按 Python 字典相等性完全相等，则不输出该条记录，否则保留它。因此每组完全相等的解析后记录只保留首次出现的一条。"
    examples: []
    verified_by: semantic-verifier:rispy-tool-semantic-v1
  - id: intent-utf8-chinese-text-preservation
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "输入以 UTF-8 解码，并将其中首次保留记录交给 rispy 原样的 Unicode 字符串值进行序列化；例如中文题名、作者、摘要等字段不会被转换为其他字符编码或替换为乱码。"
    examples: []
    verified_by: semantic-verifier:rispy-tool-semantic-v1

