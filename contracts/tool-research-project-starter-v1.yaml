        ASCII 字母数字字符替换为一个连字符、去除首尾连字符得到；若结果为空则使用 `project`。
      rationale: 为固定模板提供适合作为 Python 项目发行名称的稳定标识。
      origin: MODEL_PROPOSED
    - commitment_id: starter-module-title
