tool:
  schema_version: 4
  name: research-project-starter
  summary: 把一份项目说明 YAML 通过固定 Cookiecutter 模板生成可开工、可检查和可交接的离线研究项目工作区。
  interface:
    usage: research-project-starter <input> --out-dir <new-directory>
    input:
      kind: file
      format: UTF-8 YAML project brief（title 与 description）
      contract: null
    output:
      kind: directory
      format: offline research project workspace
      contract: null
    exit_codes:
      '0': success
      '1': user_error
      '2': internal_error
  delivery_profile_id: workspace_bundle_v1
  workspace_contract:
    schema_version: 1
    rules:
    - path_pattern: project/README.md
      role: 项目说明与启动指引
      media_type: text/markdown
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: project/pyproject.toml
      role: Python 项目元数据
      media_type: application/toml
      validation_profile: toml_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: project/.gitignore
      role: Git 忽略规则
      media_type: text/plain
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: project/src/starter_project/__init__.py
      role: 起始 Python 包
      media_type: text/x-python
      validation_profile: python_compile_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: project/tests/test_smoke.py
      role: 起始 smoke 测试
      media_type: text/x-python
      validation_profile: python_compile_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: project/run_tests.py
      role: 可执行测试入口
      media_type: text/x-python
      validation_profile: python_compile_v1
      min_count: 1
      max_count: 1
      executable: true
    - path_pattern: project/config/experiment.yaml
      role: 可复现的实验参数配置
      media_type: application/yaml
      validation_profile: yaml_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: project/scripts/bootstrap.sh
      role: 本地环境和检查启动脚本
      media_type: text/x-shellscript
      validation_profile: shell_v1
      min_count: 1
      max_count: 1
      executable: true
    - path_pattern: project/.github/workflows/ci.yml
      role: 持续集成检查配置
      media_type: application/yaml
      validation_profile: yaml_v1
      min_count: 1
      max_count: 1
      executable: false
    - path_pattern: project/REPRODUCING.md
      role: 离线复现与交接说明
      media_type: text/markdown
      validation_profile: text_utf8_v1
      min_count: 1
      max_count: 1
      executable: false
    allow_extra_files: false
    entrypoints:
    - project/run_tests.py
    runnable: true
    smoke_command:
    - ./project/run_tests.py
    smoke_timeout_seconds: 10
    require_offline_wheelhouse: false
    limits:
      max_files: 10
      max_total_bytes: 65536
      max_file_bytes: 16384
      max_depth: 4
      max_path_bytes: 240
capability:
  statement: '用户目标：我只提供一份项目说明文件，工具使用内置并固定的本地实验模板，生成一套能直接开工、也方便交接的项目文件夹。

    公开行为承诺：

    - [title-from-input] 项目说明 YAML 的 title 非空字符串会去除首尾空白，作为项目标题写入 README 的一级标题。

    - [description-preservation] 项目说明 YAML 的 description 字符串会原样写入 README 的说明标记之间；说明允许为空。

    - [normalized-distribution-name] pyproject 的 `[project].name` 由标题经 NFKD 规范化、移除非
    ASCII 字符、转小写、将连续非 ASCII 字母数字字符替换为一个连字符、去除首尾连字符得到；若结果为空则使用 `project`。

    - [starter-module-title] 生成的 `starter_project` 模块会以 Python 字符串常量 `PROJECT_NAME`
    暴露项目标题。

    - [starter-layout] 固定本地模板经 Cookiecutter 渲染后，工作区恰好包含合同列出的十个文件，覆盖 README、pyproject、源码、测试、实验配置、脚本、CI、Git
    忽略规则和复现说明。

    - [direct-test-entrypoint] 可执行的 `run_tests.py` 将源目录加入导入路径，发现 `tests` 目录中的 unittest
    测试，并以测试成功或失败决定进程状态。

    - [behavior-7] 实验配置固定声明 schema version、项目标题和随机种子 42；启动脚本创建本地虚拟环境并运行检查；CI 执行同一检查；复现说明公开对应命令和配置位置。

    公开产物协议：

    - [readme-project-title -> title-from-input] 定位：读取 `project/README.md` 的第一行；该行是唯一的一级
    ATX Markdown 标题。；值表示：UTF-8 Markdown；首行语法为 `# ` 后接项目标题的 Unicode 文本。

    - [readme-project-description -> description-preservation] 定位：读取 `project/README.md`
    中 `<!-- project-description-start -->` 与 `<!-- project-description-end -->` 两个各占一行的标记之间的全部行。；值表示：UTF-8
    文本；两个标记之间的行按原有顺序构成说明正文，允许为空。

    - [pyproject-distribution-name -> normalized-distribution-name] 定位：用 TOML 解析 `project/pyproject.toml`，读取
    `[project]` 表的 `name` 字符串字段。；值表示：TOML 基本字符串；值是小写 ASCII 字母、数字和连字符组成的非空名称。

    - [starter-module-project-name -> starter-module-title] 定位：用 Python AST 解析 `project/src/starter_project/__init__.py`，查找模块级名称
    `PROJECT_NAME` 的字符串常量赋值。；值表示：Python 源码；`PROJECT_NAME` 是一个字符串常量赋值。

    - [workspace-file-layout -> starter-layout] 定位：递归列出交付目录中的相对常规文件路径，并按 Unicode 码点升序排序。；值表示：UTF-8
    路径列表；必须与工作区契约列出的十个常规文件路径完全一致。

    - [test-runner-behavior -> direct-test-entrypoint] 定位：用 Python AST 解析 `project/run_tests.py`，读取
    `main` 函数中 `unittest.defaultTestLoader.discover` 的调用，以及模块末尾对 `main()` 返回值的 `SystemExit`
    调用。；值表示：Python AST；测试发现目录为入口脚本同级的 `tests` 目录，入口以该测试运行结果作为进程退出状态。

    - [handoff-support-files -> behavior-7] 定位：解析 `project/config/experiment.yaml`，并读取
    `project/scripts/bootstrap.sh`、`project/.github/workflows/ci.yml` 与 `project/REPRODUCING.md`
    的公开命令和配置引用。；值表示：YAML 与 UTF-8 文本；配置包含 schema version、项目标题和整数随机种子，三个说明/执行文件引用同一测试入口和配置路径。

    统一运行语义：当输入不属于公开承诺定义的有效域时抛 UserInputError（CLI exit 1）；相同输入重复运行得到逐字节一致的结果；运行期完全离线。'
  output_schema: workspace_bundle
  intent_contract:
