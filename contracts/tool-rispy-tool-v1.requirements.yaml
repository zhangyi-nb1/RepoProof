task_id: tool-rispy-tool-v1

controls:
  positive: controls/tool-rispy-tool-v1/positive
  negatives:
    - path: controls/tool-rispy-tool-v1/negative_empty
      label: NC_empty
      must_fail_nodes: ["test_example"]
    - path: controls/tool-rispy-tool-v1/negative_hardcode
      label: NC_hardcode
      must_fail_nodes: ["test_held_example"]
    - path: controls/tool-rispy-tool-v1/negative_badexit
      label: NC_badexit
      must_fail_nodes: ["test_malformed_input_is_user_error"]
  # NC_reimpl(零 import 上游)不在此表:它在 oracle 上全绿,判死属
  # provenance 层(runner 验证阶段执法;harness 测试喂它自证查得出)。
  # 见 TOOL_READY_GATE §五。目录:controls/tool-rispy-tool-v1/negative_reimpl

requirements:
  - id: satisfy-user-examples
    owner: ADAPTER
    severity: HARD
    source_field: capability.statement
    public_text: >
      调用 pinned rispy 实现能力,使全部用户样例断言通过
      (行为以公开样例为准,例:rispy-tool inputs/chinese_exact_duplicate.ris -> 见 expected/chinese_exact_duplicate.expected.txt; rispy-tool inputs/unicode_whitespace_fields.ris -> 见 expected/unicode_whitespace_fields.expected.txt)。
    examples:
      - "rispy-tool inputs/chinese_exact_duplicate.ris -> 见 expected/chinese_exact_duplicate.expected.txt; rispy-tool inputs/unicode_whitespace_fields.ris -> 见 expected/unicode_whitespace_fields.expected.txt"
    oracle_nodes:
      - "test_capability::test_example_1"
      - "test_capability::test_example_2"
      - "test_capability::test_held_example_1"
  - id: interface-contract
    owner: ADAPTER
    severity: HARD
    source_field: capability.statement
    public_text: >
      坏输入内容抛 UserInputError(骨架转 exit 1);不得让异常裸奔到
      兜底层(exit 2);重复调用同一输入输出逐字节一致;成功路径不向
      stderr 泄漏 traceback。
    examples:
      - "exit: 0=成功 1=用户错误 2=内部错误"
    oracle_nodes:
      - "test_capability::test_malformed_input_is_user_error"
      - "test_capability::test_deterministic_output"
      - "test_capability::test_stdout_purity_on_success"
  - id: skeleton-anchors-untouched
    owner: HOST_INPUT_GUARD
    severity: HARD
    source_field: capability.statement
    public_text: >
      骨架锚定件(main.py / bin/ / build.sh / tool.json / pyproject.toml)
      与其 argparse/输入存在检查/exit 语义由 harness 预置,不可修改,
      不计 agent 能力。
    examples:
      - "rispy-tool --help -> usage"
    oracle_nodes:
      - "test_interface_contract::test_help_reachable"
      - "test_interface_contract::test_missing_input_is_user_error"
  - id: intent-ris-reexport
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "工具使用 rispy 将输入的 UTF-8 RIS 文献记录解析后，重新导出为 RIS 文献记录文本。"
    examples: []
    verified_by: semantic-verifier:rispy-tool-semantic-v1
  - id: intent-exact-duplicate-definition
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "两条记录仅在分别单独交给 rispy 导出后得到完全相同的 RIS 文本时，才被视为明确重复。"
    examples: []
    verified_by: semantic-verifier:rispy-tool-semantic-v1
  - id: intent-retain-first-exact-duplicate
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "对明确重复的记录，输出只保留输入顺序中首次出现的一条，删除其后的重复条目。"
    examples: []
    verified_by: semantic-verifier:rispy-tool-semantic-v1
  - id: intent-preserve-surviving-order
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "所有未被判定为明确重复的记录都会保留，并维持其在输入中的原始相对顺序。"
    examples: []
    verified_by: semantic-verifier:rispy-tool-semantic-v1
  - id: intent-unicode-chinese-preservation
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "对 rispy 成功解析出的记录字段中的中文 Unicode 字符，导出的 UTF-8 RIS 文本写出相同的 Unicode 字符序列，不进行拼音化、替换或联网补全。"
    examples: []
    verified_by: semantic-verifier:rispy-tool-semantic-v1

