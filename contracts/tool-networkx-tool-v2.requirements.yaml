task_id: tool-networkx-tool-v2
controls:
  positive: controls/tool-networkx-tool-v2/positive
  negatives:
  - path: controls/tool-networkx-tool-v2/negative_empty
    label: NC_empty
    must_fail_nodes:
    - test_example
  - path: controls/tool-networkx-tool-v2/negative_hardcode
    label: NC_hardcode
    must_fail_nodes:
    - test_held_example
requirements:
- id: workspace-examples
  owner: ADAPTER
  severity: HARD
  source_field: capability.statement
  public_text: Generate the user-confirmed workspace for every admitted input.
  examples:
  - linear-impact
  - excluded-content
  oracle_nodes:
  - test_capability::test_example_1
  - test_capability::test_example_2
  - test_capability::test_held_example_1
- id: workspace-interface
  owner: HOST_INPUT_GUARD
  severity: HARD
  source_field: tool.interface
  public_text: Accept one local path and atomically create only a new --out-dir.
  examples:
  - networkx-tool <input> --out-dir <new-directory>
  oracle_nodes:
  - test_interface_contract::test_help_reachable
  - test_interface_contract::test_missing_input_is_user_error
  - test_interface_contract::test_existing_output_is_not_overwritten
- id: workspace-structure
  owner: HARNESS
  severity: HARD
  source_field: tool.workspace_contract
  public_text: Every output must satisfy the confirmed directory structure and format
    contract.
  examples: []
  oracle_nodes: []
  verified_by: workspace-structure-validator-v1
- id: intent-module-inventory-and-edges
  owner: ADAPTER
  severity: HARD
  source_field: capability.intent_contract.commitments
  public_text: 工作区会为未被排除目录过滤的每个 source-relative .py 文件建立一个节点，并将 AST 中每个可解析为项目内模块的
    import 或 from-import 建立为从导入方到被导入方的有向边。
  examples: []
  oracle_nodes: []
  verified_by: semantic-verifier:networkx-tool-workspace-semantic-v1
- id: intent-local-import-resolution
  owner: ADAPTER
  severity: HARD
  source_field: capability.intent_contract.commitments
  public_text: 模块名由相对路径转换：普通 .py 文件去掉扩展名，包的 __init__.py 使用其目录名；相对导入按当前模块所在包解析。导入目标在已发现模块名的最长前缀中匹配；同名候选文件存在时选择字典序最小的
    source-relative 路径。
  examples: []
  oracle_nodes: []
  verified_by: semantic-verifier:networkx-tool-workspace-semantic-v1
- id: intent-cycle-groups
  owner: ADAPTER
  severity: HARD
  source_field: capability.intent_contract.commitments
  public_text: 使用 NetworkX 有向图的强连通分量识别循环：包含两个以上模块的分量，以及单模块自环，都会作为按路径排序的 cycle_group
    写入节点表，并写入循环风险发现。
  examples: []
  oracle_nodes: []
  verified_by: semantic-verifier:networkx-tool-workspace-semantic-v1
- id: intent-transitive-impact
  owner: ADAPTER
  severity: HARD
  source_field: capability.intent_contract.commitments
  public_text: 节点表会列出每个模块的直接导入数、直接依赖方数和传递依赖方数；传递依赖方是依赖图中可沿有向路径到达该模块的其他模块，并由 NetworkX
    图祖先计算得出。
  examples: []
  oracle_nodes: []
  verified_by: semantic-verifier:networkx-tool-workspace-semantic-v1
- id: intent-risk-policy
  owner: ADAPTER
  severity: HARD
  source_field: capability.intent_contract.commitments
  public_text: risks.md 固定说明两条规则：所有循环组均为循环依赖风险；传递依赖方数不少于 3 的模块均为影响范围较大风险。文档逐项列出发现；没有发现时明确写“无。”。
  examples: []
  oracle_nodes: []
  verified_by: semantic-verifier:networkx-tool-workspace-semantic-v1
- id: intent-exclusion-rules
  owner: ADAPTER
  severity: HARD
  source_field: capability.intent_contract.commitments
  public_text: 分析会排除目录名为 .git、.hg、.svn、__pycache__、.mypy_cache、.pytest_cache、.tox、.venv、venv
    的任何路径，并忽略所有非 .py 文件；这些规则逐行写入 exclusions.txt。
  examples: []
  oracle_nodes: []
  verified_by: semantic-verifier:networkx-tool-workspace-semantic-v1
- id: intent-handoff-report
  owner: ADAPTER
  severity: HARD
  source_field: capability.intent_contract.commitments
  public_text: report.xhtml 提供离线可打开的交接概览：显示模块数和依赖边数，复述 risks.md 的全部风险发现，并明确列出 graph.json、nodes.csv、risks.md
    与 exclusions.txt 作为交接文件。
  examples: []
  oracle_nodes: []
  verified_by: semantic-verifier:networkx-tool-workspace-semantic-v1
