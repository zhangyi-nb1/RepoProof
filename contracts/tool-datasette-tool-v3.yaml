        locator: experiment.db：对 README.md“## 已导入表”表格每一行第二列指定的表，读取 PRAGMA table_info(table_name)
          和按 rowid ASC 排序的 SELECT * 结果。
        value_encoding: SQLite 表结构与行序列：PRAGMA 的 name 字段依次编码列名；每个结果行按列顺序编码为 SQLite
          TEXT 值；行顺序由升序 rowid 定义。
      - observation_id: datasette-service-launch
        commitment_ids:
        - datasette-browse-filter-and-query-service
        locator: app.py：main() 中对 datasette.cli.cli.main 的调用及其 args 参数；README.md 的“##
          启动”章节。
        value_encoding: Python 源码调用语法和 UTF-8 Markdown 指令：源码必须导入 datasette.cli 的 cli，并以数据库文件和元数据文件为参数调用
          cli.main；Markdown 指令以 ./run.sh 作为启动命令。
    delivery:
      profile_id: workspace_bundle_v1
      support_status: SUPPORTED
      origin: USER_EDITED
      requirements:
        inputs:
