task_id: tool-rispy-tool-v3

controls:
  positive: controls/tool-rispy-tool-v3/positive
  negatives:
    - path: controls/tool-rispy-tool-v3/negative_empty
      label: NC_empty
      must_fail_nodes: ["test_example"]
    - path: controls/tool-rispy-tool-v3/negative_hardcode
      label: NC_hardcode
      must_fail_nodes: ["test_held_example"]
    - path: controls/tool-rispy-tool-v3/negative_badexit
      label: NC_badexit
      must_fail_nodes: ["test_malformed_input_is_user_error"]
  # NC_reimpl(零 import 上游)不在此表:它在 oracle 上全绿,判死属
  # provenance 层(runner 验证阶段执法;harness 测试喂它自证查得出)。
  # 见 TOOL_READY_GATE §五。目录:controls/tool-rispy-tool-v3/negative_reimpl

requirements:
  - id: satisfy-user-examples
    owner: ADAPTER
    severity: HARD
    source_field: capability.statement
    public_text: >
      调用 pinned rispy 实现能力,使全部用户样例断言通过
      (行为以公开样例为准,例:rispy-tool inputs/typical_duplicate_unicode.ris -> 见 expected/typical_duplicate_unicode.expected.txt; rispy-tool inputs/duplicate_records.ris -> 见 expected/duplicate_records.expected.txt)。
    examples:
      - "rispy-tool inputs/typical_duplicate_unicode.ris -> 见 expected/typical_duplicate_unicode.expected.txt; rispy-tool inputs/duplicate_records.ris -> 见 expected/duplicate_records.expected.txt"
    oracle_nodes:
      - "test_capability::test_example_1"
      - "test_capability::test_example_2"
      - "test_capability::test_held_example_1"
  - id: interface-contract
    owner: ADAPTER
    severity: HARD
    source_field: capability.statement
    public_text: >
      坏输入内容抛 UserInputError(骨架转 exit 1);不得让异常裸奔到
      兜底层(exit 2);重复调用同一输入输出逐字节一致;成功路径不向
      stderr 泄漏 traceback。
    examples:
      - "exit: 0=成功 1=用户错误 2=内部错误"
    oracle_nodes:
      - "test_capability::test_malformed_input_is_user_error"
      - "test_capability::test_deterministic_output"
      - "test_capability::test_stdout_purity_on_success"
  - id: skeleton-anchors-untouched
    owner: HOST_INPUT_GUARD
    severity: HARD
    source_field: capability.statement
    public_text: >
      骨架锚定件(main.py / bin/ / build.sh / tool.json / pyproject.toml)
      与其 argparse/输入存在检查/exit 语义由 harness 预置,不可修改,
      不计 agent 能力。
    examples:
      - "rispy-tool --help -> usage"
    oracle_nodes:
      - "test_interface_contract::test_help_reachable"
      - "test_interface_contract::test_missing_input_is_user_error"
  - id: intent-exact-parsed-record-deduplication
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "将输入和输出都用固定版本 rispy 解析后，输出记录序列恰好等于输入序列中每个首次出现的解析记录；后续与先前记录完全相等的解析记录将被删除。"
    examples: []
    verified_by: semantic-verifier:rispy-tool-semantic-v1
  - id: intent-first-occurrence-order
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "对于同一组完全重复的解析记录，保留输入中最先出现的一条，且所有保留记录维持其在输入中的相对顺序。"
    examples: []
    verified_by: semantic-verifier:rispy-tool-semantic-v1
  - id: intent-metadata-preservation
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "每条保留记录在输出中经固定版本 rispy 解析后的字段和值与其对应的输入首次出现记录相同；工具不补充、翻译、猜测或联网查询文献信息。"
    examples: []
    verified_by: semantic-verifier:rispy-tool-semantic-v1
  - id: intent-chinese-unicode-preservation
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "保留记录中由 rispy 解析出的中文及其他 Unicode 字符串字段值，在输出再次由 rispy 解析后保持相同。"
    examples: []
    verified_by: semantic-verifier:rispy-tool-semantic-v1

