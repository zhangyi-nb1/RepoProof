      rationale: 用户要看余额还剩多少。
      origin: MODEL_PROPOSED
    - commitment_id: over-threshold-alert
      public_text: 按天花费表中，当某天合计花费严格大于阈值时，该行被标记为超阈值提醒；否则不标记；index.html 也汇总列出所有超阈值的日期（升序）。
      rationale: 用户要超阈值就提醒。
      origin: MODEL_PROPOSED
    - commitment_id: pygal-day-chart-bars
      public_text: charts/spend_by_day.svg 由 pygal 渲染为柱状图，其柱子与按天花费表逐日一一对应（相同日期集合、相同顺序、相同合计值）。
      rationale: 图表须真实反映按天汇总并由上游 pygal 生成。
