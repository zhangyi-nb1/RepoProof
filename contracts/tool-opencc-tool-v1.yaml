task_id: tool-opencc-tool-v1

source_repo:
  url: https://github.com/yichen0831/opencc-python
  revision: guided
  resolved_commit: b85452e384a3650109809fe5fefacb2ae4fe89d2
  license: Apache-2.0
  distribution: opencc-python-reimplemented
  import_module: opencc

target_project:
  kind: local_tool
  path: fixtures/tool_skeleton_opencc-tool
  package: opencc_tool
  entry_point: opencc-tool

requirement_spec_file: tool-opencc-tool-v1.requirements.yaml
task_family: LOCAL-TOOL
adoption_shape: TOOL_ONBOARDING

tool: {"name": "opencc-tool", "summary": "将简体中文纯文本文件离线、确定性地转换为繁体中文文本。", "interface": {"usage": "opencc-python-reimplemented-tool <input> [--out FILE]", "input": {"kind": "file", "format": "TXT"}, "output": {"kind": "stdout", "format": "TXT"}, "exit_codes": {"0": "success", "1": "user_error", "2": "internal_error"}}}

capability:
  statement: >
    读取一个 UTF-8 或带 UTF-8 BOM 的纯文本文件，将其中的简体中文按 OpenCC 的 s2t 规则转换为繁体中文，并输出纯文本字符串。输入解码时会移除 UTF-8 BOM；所有换行在转换前规范化为 LF（CRLF 与 CR 均变为 LF）；不裁剪首尾空白，不重排内容，不添加或删除末尾换行，除换行规范化与字符转换外保留原文本结构。非中文字符、数字、拉丁字母、空白和标点按上游 OpenCC 规则处理，不能转换的字符原样保留。格式错误、无法以 UTF-8 解码、路径不可读或空输入会抛出 UserInputError（CLI 应以 exit 1 结束）。重复运行结果确定，且完全离线，不访问网络或外部服务。 交付形态为标准工具包(TOOL_PACKAGE_LAYOUT):在骨架 src/opencc_tool/impl.py 实现 extract(),必须调用 pinned opencc-python-reimplemented;依赖锁进 requirements.lock.txt(replay 从它重建)。行为以公开样例为准(例:opencc-tool inputs/s1.txt -> 见 expected/s1.txt; opencc-tool inputs/s2.txt -> 见 expected/s2.txt);坏输入抛 UserInputError(→exit 1);重复调用确定;完全离线 CPU-only。骨架锚定件(main.py/bin/build.sh/tool.json/pyproject)不可改。公开样例与可运行公开测试位于骨架 public_tests/ 下,是本合同的一部分。
  output_schema: TXT

environment: {os: linux, arch: arm64, python: "3.12", cpu_only: true, network_install: true, network_test: false}

constraints:
  forbidden: [gpu, privileged_container, oracle_write, model_download, network_at_test_time]
  editable_zones: [tool]
  forbidden_install_extras: []

budgets:
  max_agent_steps: 20
  max_wall_time_minutes: 30
  max_command_minutes: 5
  max_semantic_recoveries: 3
  max_same_action: 2
  max_patch_files: 12
  max_patch_lines: 600
  max_input_tokens_total: 400000
  max_output_tokens_total: 40000
  monetary_soft_cap_usd: 5.0

acceptance:
  capability_command: ["pytest", "-q", "/oracle/test_capability.py"]
  regression_command: ["pytest", "-q", "public_tests/test_interface_contract.py"]
  probe_script: direct_tool_probe.py
