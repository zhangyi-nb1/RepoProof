task_id: tool-webcolors-tool-v2

source_repo:
  url: https://github.com/ubernostrum/webcolors
  revision: guided
  resolved_commit: e6392ba6eeba81b02e666eb3ed02ef2e006344c0
  license: BSD
  distribution: webcolors
  import_module: webcolors

target_project:
  kind: local_tool
  path: fixtures/tool_skeleton_webcolors-tool-v2
  package: webcolors_tool
  entry_point: webcolors-tool

requirement_spec_file: tool-webcolors-tool-v2.requirements.yaml
task_family: LOCAL-TOOL
adoption_shape: TOOL_ONBOARDING

tool: {"schema_version": 2, "name": "webcolors-tool", "summary": "从网页 HTML 中提取并规范化常见颜色，同时生成适合灰度模块使用的灰度信息。", "interface": {"usage": "webcolors-tool <input> [--out FILE]", "input": {"kind": "file", "format": "HTML", "contract": null}, "output": {"kind": "stdout", "format": "JSON", "contract": {"media_type": "application/json", "root_type": "object", "required": {"colors": "array", "count": "integer"}}}, "exit_codes": {"0": "success", "1": "user_error", "2": "internal_error"}}}

capability:
  statement: >
    从 UTF-8 HTML 中提取 CSS color、background-color、border-color、outline-color 声明以及 color、bgcolor 属性里的 CSS3 颜色名称、三位或六位十六进制颜色和整数 rgb(r,g,b)，调用 webcolors 将其规范化为小写六位十六进制值与 0–255 RGB 通道，并按 Rec. 709 系数 0.2126、0.7152、0.0722 计算四舍五入后的 0–255 灰度值。相同规范化颜色去重，结果按十六进制值升序排列；未出现受支持颜色时返回空 colors 和 count 0，不推断透明度、百分比 RGB、CSS 变量或复杂颜色函数。格式错误、非 UTF-8、不可读或空输入抛出 UserInputError（退出码 1）；重复运行结果确定一致，且全程离线。 交付形态为标准工具包(TOOL_PACKAGE_LAYOUT):在骨架 src/webcolors_tool/impl.py 实现 extract(),必须调用 pinned webcolors;依赖锁进 requirements.lock.txt(replay 从它重建)。行为以公开样例为准(例:webcolors-tool inputs/typical-colors.html -> 见 expected/typical-colors.expected.txt; webcolors-tool inputs/unicode-inline.html -> 见 expected/unicode-inline.expected.txt; webcolors-tool inputs/typical-mixed-colors.html -> 见 expected/typical-mixed-colors.expected.txt);坏输入抛 UserInputError(→exit 1);重复调用确定;完全离线 CPU-only。骨架锚定件(main.py/bin/build.sh/tool.json/pyproject)不可改。公开样例与可运行公开测试位于骨架 public_tests/ 下,是本合同的一部分。
  output_schema: "WebColorExtraction"

environment: {os: linux, arch: arm64, python: "3.12", cpu_only: true, network_install: true, network_test: false}

constraints:
  forbidden: [gpu, privileged_container, oracle_write, model_download, network_at_test_time]
  editable_zones: [tool]
  forbidden_install_extras: []

budgets:
  max_agent_steps: 20
  max_wall_time_minutes: 30
  max_command_minutes: 5
  max_semantic_recoveries: 3
  max_same_action: 2
  max_patch_files: 12
  max_patch_lines: 600
  max_input_tokens_total: 400000
  max_output_tokens_total: 40000
  monetary_soft_cap_usd: 5.0

acceptance:
  capability_command: ["pytest", "-q", "/oracle/test_capability.py"]
  regression_command: ["pytest", "-q", "public_tests/test_interface_contract.py"]
  probe_script: direct_tool_probe.py
