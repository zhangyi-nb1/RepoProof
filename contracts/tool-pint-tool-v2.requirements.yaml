task_id: tool-pint-tool-v2

controls:
  positive: controls/tool-pint-tool-v2/positive
  negatives:
    - path: controls/tool-pint-tool-v2/negative_empty
      label: NC_empty
      must_fail_nodes: ["test_example"]
    - path: controls/tool-pint-tool-v2/negative_hardcode
      label: NC_hardcode
      must_fail_nodes: ["test_held_example"]
    - path: controls/tool-pint-tool-v2/negative_badexit
      label: NC_badexit
      must_fail_nodes: ["test_malformed_input_is_user_error"]
  # NC_reimpl(零 import 上游)不在此表:它在 oracle 上全绿,判死属
  # provenance 层(runner 验证阶段执法;harness 测试喂它自证查得出)。
  # 见 TOOL_READY_GATE §五。目录:controls/tool-pint-tool-v2/negative_reimpl

requirements:
  - id: satisfy-user-examples
    owner: ADAPTER
    severity: HARD
    source_field: capability.statement
    public_text: >
      调用 pinned Pint 实现能力,使全部用户样例断言通过
      (行为以公开样例为准,例:pint-tool inputs/typical_valid.tsv -> 见 expected/typical_valid.expected.txt; pint-tool inputs/nonascii_invalid_values.tsv -> 见 expected/nonascii_invalid_values.expected.txt)。
    examples:
      - "pint-tool inputs/typical_valid.tsv -> 见 expected/typical_valid.expected.txt; pint-tool inputs/nonascii_invalid_values.tsv -> 见 expected/nonascii_invalid_values.expected.txt"
    oracle_nodes:
      - "test_capability::test_example_1"
      - "test_capability::test_example_2"
      - "test_capability::test_held_example_1"
  - id: interface-contract
    owner: ADAPTER
    severity: HARD
    source_field: capability.statement
    public_text: >
      坏输入内容抛 UserInputError(骨架转 exit 1);不得让异常裸奔到
      兜底层(exit 2);重复调用同一输入输出逐字节一致;成功路径不向
      stderr 泄漏 traceback。
    examples:
      - "exit: 0=成功 1=用户错误 2=内部错误"
    oracle_nodes:
      - "test_capability::test_malformed_input_is_user_error"
      - "test_capability::test_deterministic_output"
      - "test_capability::test_stdout_purity_on_success"
  - id: skeleton-anchors-untouched
    owner: HOST_INPUT_GUARD
    severity: HARD
    source_field: capability.statement
    public_text: >
      骨架锚定件(main.py / bin/ / build.sh / tool.json / pyproject.toml)
      与其 argparse/输入存在检查/exit 语义由 harness 预置,不可修改,
      不计 agent 能力。
    examples:
      - "pint-tool --help -> usage"
    oracle_nodes:
      - "test_interface_contract::test_help_reachable"
      - "test_interface_contract::test_missing_input_is_user_error"
  - id: intent-output-columns
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "输出为可粘贴到 Excel 的 TSV，表头依次且仅为“样本名、原数值、目标单位、换算结果、状态、说明”。"
    examples: []
    verified_by: semantic-verifier:pint-tool-semantic-v1
  - id: intent-row-order-and-retention
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "输入中的每一数据行在输出中恰好对应一行，且保持原有顺序；输出行的“样本名”“原数值”“目标单位”逐字符保留输入单元格内容。"
    examples: []
    verified_by: semantic-verifier:pint-tool-semantic-v1
  - id: intent-pint-conversion
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "对于 Pint 能解析的“原数值”及可转换的“目标单位”，换算结果使用 Pint 0.25.3 的 UnitRegistry 将该数量转换到目标单位后得到的 magnitude。"
    examples: []
    verified_by: semantic-verifier:pint-tool-semantic-v1
  - id: intent-successful-row-status
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "成功换算的行，“状态”为“已换算”，“说明”为空，“换算结果”为转换后数值。"
    examples: []
    verified_by: semantic-verifier:pint-tool-semantic-v1
  - id: intent-short-decimal-format
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "成功行的“换算结果”按 Python 的六位小数格式化，再去除末尾的零和末尾小数点，因此最多显示 6 位小数且不保留无意义尾零。"
    examples: []
    verified_by: semantic-verifier:pint-tool-semantic-v1
  - id: intent-pint-failure-preservation
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "若 Pint 在解析原数值或转换到目标单位时抛出 PintError，该行不丢弃：换算结果为空，状态为“未换算”，说明以“无法换算：”开头并包含异常类名和异常信息。"
    examples: []
    verified_by: semantic-verifier:pint-tool-semantic-v1
  - id: intent-nonfinite-result-preservation
    owner: ADAPTER
    severity: HARD
    source_field: capability.intent_contract.commitments
    public_text: "若 Pint 转换得到的 magnitude 不是有限实数，该行换算结果为空、状态为“未换算”、说明为“无法换算：结果不是有限实数”。"
    examples: []
    verified_by: semantic-verifier:pint-tool-semantic-v1

