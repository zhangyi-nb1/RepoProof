        value_encoding: 每张指标幻灯片的拼接文本包含对应指标的 name、value 与 delta 三个子串。
      - observation_id: metric-slide-order
        commitment_ids:
        - metric-slide-order-sorted
        locator: 对 slides[1:] 依序提取每张幻灯片对应的指标 name（可由该页文本匹配到某个输入指标名）。
        value_encoding: 得到的 name 序列按 Unicode 码点升序排列。
      - observation_id: notes-metric-lines
        commitment_ids:
        - notes-lists-all-metrics
        locator: 以 UTF-8 读取 output/speaker_notes.txt 的全部行。
        value_encoding: 对每一项输入指标，存在一行同时包含其 name、value 与 delta。
      - observation_id: notes-input-notes
        commitment_ids:
        - notes-includes-input-notes
        locator: 以 UTF-8 读取 output/speaker_notes.txt 的全部内容。
        value_encoding: 对输入 notes 中的每条字符串，其文本作为子串出现在讲稿内容中。
    delivery:
      profile_id: workspace_bundle_v1
      support_status: SUPPORTED
      origin: MODEL_PROPOSED
      requirements:
        inputs:
        - kind: file
          location: local
          representation: utf8_text
          format_label: JSON（季度指标 + 要点笔记）
          role: 单个 JSON 文件，含季度指标数组与每张幻灯片的要点笔记，用于生成幻灯片与讲稿。
        outputs:
        - kind: directory
          format_id: workspace_bundle
          format_label: 离线多文件工作区
          role: 包含生成的 .pptx 汇报幻灯片、纯文本讲稿以及运行入口的离线工作区目录。
        network: offline
        credentials: none
        lifecycle: per_invocation
